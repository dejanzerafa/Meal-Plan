<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoulGainz · Recipe Review</title>
<style>
  :root { --bg:#1a1612; --card:#2c2520; --card2:#3a312a; --dim:rgba(255,255,255,.09); --text:#f0e8dc; --sub:#a89880; --muted:#6b5c4e;
          --accent:#E07B2A; --green:#22c55e; --blue:#60a5fa; --red:#ef4444; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  header { position:sticky; top:0; z-index:5; background:var(--bg); border-bottom:1px solid var(--dim); padding:12px 18px; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header b span { color:var(--accent); }
  .stat { font-size:12px; color:var(--sub); }
  .stat strong { color:var(--text); }
  input[type=search], select { background:var(--card2); color:var(--text); border:1px solid var(--dim); border-radius:8px; padding:7px 10px; font:inherit; }
  button { font:inherit; font-weight:800; border-radius:8px; padding:7px 12px; cursor:pointer; border:1px solid var(--dim); background:var(--card2); color:var(--text); }
  button.primary { background:var(--accent); border-color:var(--accent); color:#000; }
  main { max-width:1200px; margin:0 auto; padding:18px; }
  .cand { background:var(--card); border:1px solid var(--dim); border-radius:14px; margin-bottom:14px; overflow:hidden; }
  .cand.keep-ours { border-color:var(--blue); } .cand.replace { border-color:var(--red); } .cand.both, .cand.new { border-color:var(--green); } .cand.skip { opacity:.55; }
  .head { display:flex; gap:12px; align-items:center; padding:12px 14px; cursor:pointer; }
  .head .t { flex:1; min-width:0; }
  .head .t b { font-size:15px; }
  .head .meta { font-size:11px; color:var(--sub); margin-top:2px; }
  .pill { font-size:10px; font-weight:900; letter-spacing:.08em; padding:3px 8px; border-radius:20px; border:1px solid var(--dim); color:var(--sub); white-space:nowrap; }
  .pill.dec-keep-ours { color:var(--blue); border-color:var(--blue); } .pill.dec-replace { color:var(--red); border-color:var(--red); }
  .pill.dec-both, .pill.dec-new { color:var(--green); border-color:var(--green); } .pill.dec-skip { color:var(--muted); }
  .pill.built { color:var(--green); border-color:var(--green); }
  .body { display:none; border-top:1px solid var(--dim); }
  .cand.open .body { display:block; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:0; }
  @media (max-width:820px) { .cols { grid-template-columns:1fr; } }
  .col { padding:14px; }
  .col + .col { border-left:1px solid var(--dim); }
  .col h4 { margin:0 0 6px; font-size:11px; letter-spacing:.1em; color:var(--sub); }
  .col h3 { margin:0 0 4px; font-size:15px; }
  .macros { display:flex; gap:10px; font-size:12px; margin:6px 0 10px; flex-wrap:wrap; }
  .macros span { background:var(--card2); border-radius:6px; padding:3px 8px; }
  .macros .p { color:var(--accent); font-weight:800; }
  .warn { font-size:11px; color:var(--red); margin-bottom:8px; }
  ul, ol { margin:0 0 10px; padding-left:18px; font-size:12px; color:var(--text); }
  li { margin-bottom:2px; }
  .libpick { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .libpick button { font-size:11px; padding:5px 9px; font-weight:700; }
  .libpick button.on { border-color:var(--accent); color:var(--accent); }
  .actions { display:flex; gap:8px; flex-wrap:wrap; padding:12px 14px; border-top:1px solid var(--dim); align-items:center; }
  .actions button.on { outline:2px solid var(--accent); }
  .actions textarea { flex:1; min-width:200px; background:var(--card2); color:var(--text); border:1px solid var(--dim); border-radius:8px; padding:7px 10px; font:inherit; font-size:12px; resize:vertical; min-height:34px; }
  .empty { color:var(--sub); padding:30px; text-align:center; }
  #out { position:fixed; left:0; right:0; bottom:0; background:#0f0c0a; border-top:1px solid var(--dim); padding:10px 18px; display:flex; gap:10px; align-items:center; font-size:12px; color:var(--sub); z-index:5; }
</style>
</head>
<body>
<header>
  <b>Soul<span>Gainz</span> · Recipe Review</b>
  <input type="search" id="q" placeholder="Search…" oninput="render()">
  <select id="src" onchange="render()">
    <option value="all">All sources</option><option value="ig">Instagram</option><option value="cb">Cookbook</option>
  </select>
  <select id="flt" onchange="render()">
    <option value="all">All</option><option value="dup">With a library match</option><option value="nodup">No match</option>
    <option value="undecided">Undecided</option><option value="decided">Decided</option><option value="built">Already built</option>
  </select>
  <span class="stat" id="stats"></span>
</header>
<main id="list"></main>
<div id="out">
  <span id="outmsg">Decisions save automatically in this browser.</span>
  <button class="primary" onclick="exportDecisions()">Copy decisions</button>
  <button onclick="downloadDecisions()">Download .json</button>
  <button onclick="if(confirm('Clear every decision?')){localStorage.removeItem(KEY);dec={};render();}">Reset</button>
</div>
<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const KEY = 'sg_review_' + DATA.generated;
let dec = {}; try { dec = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (_) {}
let open = null;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mac = (m, label) => !m ? `<div class="macros"><span>${label}: no figures</span></div>` :
  `<div class="macros"><span>${m.kcal ?? '–'} kcal</span><span class="p">${m.protein ?? '–'} P</span><span>${m.carbs ?? '–'} C</span><span>${m.fat ?? '–'} F</span><span style="color:var(--sub)">${label}</span></div>`;
function save() { localStorage.setItem(KEY, JSON.stringify(dec)); }
function decide(id, d) { dec[id] = { ...(dec[id] || {}), decision: d, ours: (dec[id] || {}).ours || (DATA.candidates.find(c => c.id === id).matches[0] || null) }; save(); render(); }
function note(id, v) { dec[id] = { ...(dec[id] || {}), note: v }; save(); }
function pickOurs(id, lib) { dec[id] = { ...(dec[id] || {}), ours: lib }; save(); render(); }
function toggle(id) { open = open === id ? null : id; render(); }
function libCard(l) {
  if (!l) return '<div class="empty">No matching recipe in the library — nothing to compare.</div>';
  return `<h3>${esc(l.name)}</h3><div class="meta" style="font-size:11px;color:var(--sub)">${esc(l.id)} · ${esc(l.category)} · ${esc(l.subtitle || '')} · ${l.portions || 1} portion(s) as written${l.allergens && l.allergens.length ? ' · ⚠ ' + esc(l.allergens.join(', ')) : ''}</div>
  ${mac(l.perPortion, 'per portion, computed')}
  <h4>INGREDIENTS</h4><ul>${(l.batchItems || []).map(i => `<li>${i.qty} ${esc(i.unit)} ${esc(i.label)}</li>`).join('')}</ul>
  <h4>METHOD</h4><ol>${(l.steps || []).map(s => `<li>${esc(s)}</li>`).join('')}</ol>`;
}
function render() {
  const q = document.getElementById('q').value.toLowerCase(), src = document.getElementById('src').value, flt = document.getElementById('flt').value;
  const list = DATA.candidates.filter(c => {
    if (src !== 'all' && !c.id.startsWith(src)) return false;
    const d = dec[c.id] && dec[c.id].decision;
    if (flt === 'dup' && !c.matches.length) return false;
    if (flt === 'nodup' && c.matches.length) return false;
    if (flt === 'undecided' && d) return false;
    if (flt === 'decided' && !d) return false;
    if (flt === 'built' && !c.built_as) return false;
    if (q && !(c.title + ' ' + c.source + ' ' + c.matches.map(m => DATA.library[m].name).join(' ')).toLowerCase().includes(q)) return false;
    return true;
  });
  const decided = Object.values(dec).filter(d => d.decision).length;
  document.getElementById('stats').innerHTML = `<strong>${list.length}</strong> shown · <strong>${DATA.candidates.length}</strong> candidates · <strong>${decided}</strong> decided`;
  document.getElementById('list').innerHTML = list.length ? list.map(c => {
    const d = dec[c.id] || {}; const cls = d.decision ? d.decision : '';
    const ours = d.ours || c.matches[0]; const l = ours ? DATA.library[ours] : null;
    const drift = c.claim && c.computed && c.claim.kcal ? Math.round((c.computed.kcal - c.claim.kcal) / c.claim.kcal * 100) : null;
    const decLabel = { 'keep-ours': 'KEEP OURS', 'replace': 'REPLACE WITH NEW', 'both': 'KEEP BOTH', 'new': 'BUILD IT', 'skip': 'SKIP' }[d.decision] || 'UNDECIDED';
    return `<div class="cand ${cls} ${open === c.id ? 'open' : ''}">
      <div class="head" onclick="toggle('${c.id}')">
        <div class="t"><b>${esc(c.title)}</b><div class="meta">${esc(c.source)} · serves ${c.serves ?? '?'}${c.matches.length ? ' · matches: ' + c.matches.map(m => esc(DATA.library[m].name)).join(', ') : ' · no library match'}</div></div>
        ${c.built_as ? `<span class="pill built">BUILT · ${esc(c.built_as.split(' ')[0])}</span>` : ''}
        <span class="pill dec-${d.decision || ''}">${decLabel}</span>
      </div>
      <div class="body">
        <div class="cols">
          <div class="col"><h4>NEW — AS POSTED</h4><h3>${esc(c.title)}</h3>
            ${mac(c.claim, 'per serving, as claimed')}${c.computed ? mac(c.computed, 'per serving, computed from ingredients') : ''}${c.coverage ? `<div class="meta" style="font-size:11px;color:var(--sub);margin-bottom:8px">${esc(c.coverage)}</div>` : ''}
            ${drift !== null && Math.abs(drift) >= 10 ? `<div class="warn">Post's calories are ${drift > 0 ? 'under' : 'over'}stated by ${Math.abs(drift)}%</div>` : ''}
            ${c.built_as ? `<div class="warn" style="color:var(--green)">Already built as ${esc(c.built_as)}</div>` : ''}
            <h4>INGREDIENTS</h4><ul>${c.ingredients.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
            <h4>METHOD</h4><ol>${c.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol></div>
          <div class="col"><h4>OURS — IN THE LIBRARY</h4>
            ${c.matches.length > 1 ? `<div class="libpick">${c.matches.map(m => `<button class="${m === ours ? 'on' : ''}" onclick="pickOurs('${c.id}','${m}')">${esc(DATA.library[m].name)}</button>`).join('')}</div>` : ''}
            ${libCard(l)}</div>
        </div>
        <div class="actions">
          ${l ? `<button class="${d.decision === 'keep-ours' ? 'on' : ''}" onclick="decide('${c.id}','keep-ours')">Keep ours</button>
                 <button class="${d.decision === 'replace' ? 'on' : ''}" onclick="decide('${c.id}','replace')">Replace with new</button>
                 <button class="${d.decision === 'both' ? 'on' : ''}" onclick="decide('${c.id}','both')">Keep both</button>`
              : `<button class="${d.decision === 'new' ? 'on' : ''}" onclick="decide('${c.id}','new')">Build it</button>`}
          <button class="${d.decision === 'skip' ? 'on' : ''}" onclick="decide('${c.id}','skip')">Skip</button>
          <textarea placeholder="Note for the build (portion size, swaps, tier…)" onchange="note('${c.id}', this.value)">${esc(d.note || '')}</textarea>
        </div>
      </div></div>`;
  }).join('') : '<div class="empty">Nothing matches.</div>';
}
function payload() {
  return JSON.stringify({ generated: DATA.generated, decisions: Object.fromEntries(Object.entries(dec).filter(([, d]) => d.decision).map(([id, d]) => {
    const c = DATA.candidates.find(x => x.id === id); return [id, { title: c.title, decision: d.decision, ours: d.ours || c.matches[0] || null, note: d.note || '' }]; })) }, null, 2);
}
function exportDecisions() { navigator.clipboard.writeText(payload()).then(() => { document.getElementById('outmsg').textContent = 'Copied — paste it to Claude.'; }); }
function downloadDecisions() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([payload()], { type: 'application/json' })); a.download = 'recipe-decisions-' + DATA.generated + '.json'; a.click(); }
render();
</script>
</body>
</html>
