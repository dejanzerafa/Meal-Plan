<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SoulGainz · Recipe Review</title>
<style>
  :root { --bg:#1a1612; --card:#2c2520; --card2:#3a312a; --dim:rgba(255,255,255,.1); --text:#f0e8dc; --sub:#a89880; --muted:#6b5c4e;
          --accent:#E07B2A; --green:#22c55e; --blue:#60a5fa; --red:#ef4444; }
  * { box-sizing:border-box; }
  html, body { height:100%; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; display:flex; flex-direction:column; }
  header { display:flex; align-items:center; gap:14px; padding:12px 20px; border-bottom:1px solid var(--dim); }
  header b span { color:var(--accent); }
  .prog { flex:1; height:8px; background:var(--card2); border-radius:4px; overflow:hidden; }
  .prog i { display:block; height:100%; background:var(--accent); width:0; transition:width .2s; }
  .count { font-size:13px; color:var(--sub); white-space:nowrap; }
  .count b { color:var(--text); }
  header button { font:inherit; font-size:12px; font-weight:700; border-radius:8px; padding:6px 10px; cursor:pointer; border:1px solid var(--dim); background:transparent; color:var(--sub); }
  main { flex:1; overflow:auto; padding:20px; }
  .wrap { max-width:980px; margin:0 auto; }
  .title { display:flex; align-items:baseline; gap:12px; flex-wrap:wrap; }
  .title h1 { margin:0; font-size:26px; line-height:1.2; }
  .src { font-size:13px; color:var(--sub); }
  .verdict { margin:10px 0 16px; padding:12px 14px; border-radius:12px; background:var(--card); border-left:4px solid var(--accent); font-size:15px; }
  .verdict.dup { border-left-color:var(--blue); }
  .verdict.built { border-left-color:var(--green); }
  .macros { display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 12px; }
  .macros span { background:var(--card2); border-radius:8px; padding:6px 12px; font-size:14px; }
  .macros .p { color:var(--accent); font-weight:800; }
  .macros .lbl { background:transparent; color:var(--sub); padding-left:0; }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
  @media (max-width:800px) { .cols { grid-template-columns:1fr; } }
  .box { background:var(--card); border:1px solid var(--dim); border-radius:14px; padding:14px 16px; }
  .box h3 { margin:0 0 2px; font-size:16px; }
  .box h4 { margin:12px 0 4px; font-size:11px; letter-spacing:.12em; color:var(--sub); }
  .box .meta { font-size:12px; color:var(--sub); }
  ul, ol { margin:0; padding-left:18px; font-size:14px; }
  li { margin-bottom:3px; }
  details summary { cursor:pointer; color:var(--sub); font-size:13px; margin-top:8px; }
  .pick { display:flex; gap:6px; flex-wrap:wrap; margin:6px 0 10px; }
  .pick button { font:inherit; font-size:12px; font-weight:700; padding:5px 9px; border-radius:8px; border:1px solid var(--dim); background:var(--card2); color:var(--sub); cursor:pointer; }
  .pick button.on { border-color:var(--accent); color:var(--accent); }
  footer { border-top:1px solid var(--dim); padding:12px 20px calc(12px + env(safe-area-inset-bottom)); background:#14110e; }
  .acts { max-width:980px; margin:0 auto; display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  .acts button { font:inherit; font-size:15px; font-weight:800; padding:14px 18px; border-radius:12px; border:1px solid var(--dim); background:var(--card2); color:var(--text); cursor:pointer; flex:1; min-width:140px; }
  .acts button small { display:block; font-weight:500; font-size:11px; color:var(--sub); margin-top:2px; }
  .acts button.yes { background:var(--green); border-color:var(--green); color:#000; } .acts button.yes small { color:#0008; }
  .acts button.ours { background:rgba(96,165,250,.15); border-color:var(--blue); color:var(--blue); }
  .acts button.rep { background:rgba(239,68,68,.15); border-color:var(--red); color:var(--red); }
  .acts button.on { outline:3px solid #fff8; }
  .acts .nav { flex:0 0 auto; min-width:0; padding:14px; }
  .note { max-width:980px; margin:10px auto 0; display:flex; gap:10px; }
  .note input { flex:1; font:inherit; font-size:13px; background:var(--card2); color:var(--text); border:1px solid var(--dim); border-radius:10px; padding:9px 12px; }
  .keys { font-size:11px; color:var(--muted); text-align:center; margin-top:8px; }
  .done { text-align:center; padding:40px 20px; }
  .done h2 { font-size:24px; }
  .done button { font:inherit; font-weight:800; padding:14px 22px; border-radius:12px; border:none; background:var(--accent); color:#000; cursor:pointer; font-size:15px; margin:6px; }
  .list { max-width:980px; margin:0 auto; }
  .row { display:flex; gap:10px; align-items:center; padding:9px 12px; border-bottom:1px solid var(--dim); cursor:pointer; font-size:14px; }
  .row:hover { background:var(--card); }
  .row .n { flex:1; }
  .row .d { font-size:11px; font-weight:800; letter-spacing:.06em; color:var(--sub); }
  .d.new, .d.both { color:var(--green); } .d.keep-ours { color:var(--blue); } .d.replace { color:var(--red); }
</style>
</head>
<body>
<header>
  <b>Soul<span>Gainz</span> Review</b>
  <div class="prog"><i id="bar"></i></div>
  <span class="count" id="count"></span>
  <button onclick="toggleList()" id="listBtn">List</button>
  <button onclick="exportDecisions()">Copy decisions</button>
</header>
<main id="main"></main>
<footer id="foot"></footer>
<script id="data" type="application/json">__DATA__</script>
<script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const KEY = 'sg_review_' + DATA.generated;
let dec = {}; try { dec = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (_) {}
// Order: Instagram first, then cookbook by computed protein (highest first) so the
// worthwhile ones come early and the 4 g smoothies sit at the end.
const ORDER = DATA.candidates.slice().sort((a, b) => {
  const ia = a.id.startsWith('ig') ? 0 : 1, ib = b.id.startsWith('ig') ? 0 : 1;
  if (ia !== ib) return ia - ib;
  if (ia === 0) return parseInt(a.id.slice(2)) - parseInt(b.id.slice(2));
  return ((b.computed || b.claim || {}).protein || 0) - ((a.computed || a.claim || {}).protein || 0);
});
let idx = Math.max(0, ORDER.findIndex(c => !(dec[c.id] && dec[c.id].decision)));
if (idx < 0) idx = 0;
let listMode = false;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const save = () => localStorage.setItem(KEY, JSON.stringify(dec));
const macros = (m, label) => !m ? '' : `<div class="macros"><span>${m.kcal ?? '–'} kcal</span><span class="p">${m.protein ?? '–'} g protein</span><span>${m.carbs ?? '–'} C</span><span>${m.fat ?? '–'} F</span><span class="lbl">${label}</span></div>`;
const decLabel = { 'new': 'ADD', 'both': 'ADD (keep ours too)', 'keep-ours': 'KEEP OURS', 'replace': 'REPLACE OURS', 'skip': 'SKIP' };

function verdict(c, l) {
  const cm = c.computed, cl = c.claim;
  const bits = [];
  if (c.built_as) bits.push(`Already built and checked (${c.built_as}) — waiting for your approval.`);
  if (cm && cl && cl.kcal) { const d = Math.round((cm.kcal - cl.kcal) / cl.kcal * 100); if (Math.abs(d) >= 15) bits.push(`The post's calories are ${Math.abs(d)}% ${d > 0 ? 'under' : 'over'}stated (claims ${cl.kcal}, ingredients give ${cm.kcal}).`); }
  if (cm && cm.protein != null) { if (cm.protein < 20) bits.push(`Only ${cm.protein} g protein per serving — low for the app unless rebuilt.`); else if (cm.protein >= 30) bits.push(`${cm.protein} g protein per serving — meets the app's target.`); }
  if (l) bits.push(`Similar to ours: <b>${esc(l.name)}</b> (${l.perPortion.kcal} kcal · ${l.perPortion.protein} g protein).`); else bits.push('Nothing like it in the library.');
  return bits.join(' ');
}

function renderCard() {
  const c = ORDER[idx]; const d = dec[c.id] || {};
  const ours = d.ours || c.matches[0]; const l = ours ? DATA.library[ours] : null;
  document.getElementById('main').innerHTML = `<div class="wrap">
    <div class="title"><h1>${esc(c.title)}</h1><span class="src">${esc(c.source)} · serves ${c.serves ?? '?'}</span></div>
    <div class="verdict ${c.built_as ? 'built' : l ? 'dup' : ''}">${verdict(c, l)}</div>
    <div class="cols">
      <div class="box"><h3>New recipe</h3>
        ${macros(c.computed, 'from the ingredients')}${macros(c.claim, 'as the post claims')}
        ${c.coverage ? `<div class="meta">${esc(c.coverage)}</div>` : ''}
        <h4>INGREDIENTS</h4><ul>${c.ingredients.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
        <details><summary>Method (${c.steps.length} steps)</summary><ol>${c.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol></details>
      </div>
      <div class="box">${l ? `<h3>Ours: ${esc(l.name)}</h3><div class="meta">${esc(l.id)} · ${esc(l.category)} · ${esc(l.subtitle || '')}</div>
        ${c.matches.length > 1 ? `<div class="pick">${c.matches.map(m => `<button class="${m === ours ? 'on' : ''}" onclick="pickOurs('${c.id}','${m}')">${esc(DATA.library[m].name)}</button>`).join('')}</div>` : ''}
        ${macros(l.perPortion, 'per portion, verified')}
        <h4>INGREDIENTS (1 portion)</h4><ul>${(l.batchItems || []).map(i => `<li>${i.qty} ${esc(i.unit)} ${esc(i.label)}</li>`).join('')}</ul>
        <details><summary>Method (${(l.steps || []).length} steps)</summary><ol>${(l.steps || []).map(s => `<li>${esc(s)}</li>`).join('')}</ol></details>`
        : `<h3>No match in the library</h3><div class="meta">This would be a new dish, not a variant.</div>`}</div>
    </div></div>`;
  const b = (cls, dcode, label, sub) => `<button class="${cls} ${d.decision === dcode ? 'on' : ''}" onclick="decide('${dcode}')">${label}<small>${sub}</small></button>`;
  document.getElementById('foot').innerHTML = `<div class="acts">
    <button class="nav" onclick="go(-1)">←</button>
    ${l ? b('ours', 'keep-ours', 'Keep ours', 'skip the new one') + b('rep', 'replace', 'Replace ours', 'new one takes its place') + b('yes', 'both', 'Add as well', 'keep both')
        : b('yes', 'new', 'Add it', 'build into pending')}
    ${b('', 'skip', 'Skip', 'not for us')}
    <button class="nav" onclick="go(1)">→</button>
  </div>
  <div class="note"><input placeholder="Note for the build (optional): portion, swap, tier…" value="${esc(d.note || '')}" onchange="note(this.value)"></div>
  <div class="keys">Keys: 1 keep ours · 2 replace · 3 add · 4 skip · ← → move · L list</div>`;
  updateHeader();
}
function renderList() {
  document.getElementById('main').innerHTML = `<div class="list">${ORDER.map((c, i) => { const d = dec[c.id] || {}; return `<div class="row" onclick="jump(${i})"><span class="n">${esc(c.title)} <span class="src">${esc(c.source)}</span></span><span class="d ${d.decision || ''}">${decLabel[d.decision] || ''}</span></div>`; }).join('')}</div>`;
  document.getElementById('foot').innerHTML = '';
  updateHeader();
}
function renderDone() {
  const n = Object.values(dec).filter(x => x.decision && x.decision !== 'skip').length;
  document.getElementById('main').innerHTML = `<div class="done"><h2>All ${ORDER.length} reviewed</h2><p>${n} to build. Copy the decisions and paste them to Claude.</p>
    <button onclick="exportDecisions()">Copy decisions</button><button onclick="toggleList()" style="background:var(--card2);color:var(--text)">Review the list</button></div>`;
  document.getElementById('foot').innerHTML = '';
  updateHeader();
}
function updateHeader() {
  const done = ORDER.filter(c => dec[c.id] && dec[c.id].decision).length;
  document.getElementById('bar').style.width = (done / ORDER.length * 100) + '%';
  document.getElementById('count').innerHTML = `<b>${done}</b> / ${ORDER.length} decided · #${idx + 1}`;
}
function render() { if (listMode) renderList(); else if (idx >= ORDER.length) renderDone(); else renderCard(); }
function decide(code) { const c = ORDER[idx]; dec[c.id] = { ...(dec[c.id] || {}), decision: code, ours: (dec[c.id] || {}).ours || c.matches[0] || null }; save(); go(1); }
function note(v) { const c = ORDER[idx]; dec[c.id] = { ...(dec[c.id] || {}), note: v }; save(); }
function pickOurs(id, lib) { dec[id] = { ...(dec[id] || {}), ours: lib }; save(); render(); }
function go(n) { idx = Math.min(ORDER.length, Math.max(0, idx + n)); listMode = false; render(); window.scrollTo(0, 0); document.getElementById('main').scrollTop = 0; }
function jump(i) { idx = i; listMode = false; render(); }
function toggleList() { listMode = !listMode; render(); }
function payload() {
  return JSON.stringify({ generated: DATA.generated, decisions: Object.fromEntries(Object.entries(dec).filter(([, d]) => d.decision).map(([id, d]) => {
    const c = DATA.candidates.find(x => x.id === id); return [id, { title: c.title, decision: d.decision, ours: d.ours || c.matches[0] || null, note: d.note || '' }]; })) }, null, 2);
}
function exportDecisions() { navigator.clipboard.writeText(payload()).then(() => alert('Copied. Paste it to Claude.')).catch(() => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([payload()], { type: 'application/json' })); a.download = 'recipe-decisions.json'; a.click(); }); }
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const c = ORDER[idx]; if (!c) return; const hasOurs = !!(c.matches && c.matches.length);
  if (e.key === 'ArrowRight') go(1); else if (e.key === 'ArrowLeft') go(-1);
  else if (e.key === '1' && hasOurs) decide('keep-ours'); else if (e.key === '2' && hasOurs) decide('replace');
  else if (e.key === '3') decide(hasOurs ? 'both' : 'new'); else if (e.key === '4') decide('skip'); else if (e.key.toLowerCase() === 'l') toggleList();
});
render();
</script>
</body>
</html>
