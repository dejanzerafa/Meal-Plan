ud83d\udca1 Keep the dressing and croutons in separate pots. Dress a Caesar the night before and you have soup by lunch.", "\ud83d\udca1 The post said 43 g protein. 170 g of breast alone is 38 g \u2014 with the parmesan and yogurt it is 54. Trust the weights, not the caption."]}, "bf13": {"id": "bf13", "name": "\ud83e\uded0 Blueberry Cinnamon Protein Oats", "category": "breakfast", "subtitle": "No cook \u00b7 4 min", "perPortion": {"kcal": 392, "protein": 39.9, "carbs": 47.4, "fat": 5.2}, "portions": 1, "batchItems": [{"qty": 50, "unit": "g", "label": "Rolled oats"}, {"qty": 30, "unit": "g", "label": "ON Rich Chocolate whey (1 scoop)"}, {"qty": 60, "unit": "mL", "label": "Skimmed milk"}, {"qty": 50, "unit": "g", "label": "Greek yogurt 0%"}, {"qty": 40, "unit": "g", "label": "Blueberries"}, {"qty": 2, "unit": "g", "label": "Cinnamon"}], "steps": ["In a bowl or jar, combine rolled oats, skimmed milk, Greek yogurt, and whey protein. Stir until fully mixed and smooth.", "Fold in blueberries and dust generously with cinnamon.", "Eat immediately for fresh texture, or refrigerate 15\u201330 min for a thicker overnight oats consistency."]}, "m90": {"id": "m90", "name": "\ud83d\udc1f Teriyaki Salmon & Brown Rice Power Bowls", "category": "main", "subtitle": "Oven \u00b7 35 min \u00b7 4 servings", "perPortion": {"kcal": 537, "protein": 36, "carbs": 49.2, "fat": 21.1}, "portions": 4, "batchItems": [{"qty": 580, "unit": "g", "label": "Salmon fillets (raw)"}, {"qty": 200, "unit": "g", "label": "Brown rice (dry)"}, {"qty": 200, "unit": "g", "label": "Broccoli florets"}, {"qty": 120, "unit": "mL", "label": "Teriyaki sauce (low-sodium)"}, {"qty": 20, "unit": "g", "label": "Spring onion (sliced)"}, {"qty": 15, "unit": "g", "label": "Garlic (minced)"}], "steps": ["Preheat oven to 200\u00b0C (400\u00b0F). Cook brown rice per packet instructions.", "Place the salmon fillets skin-side down on a foil-lined baking tray. No oil needed. Stir the 15 g minced garlic into the teriyaki sauce, then spoon half of it over the fillets.", "Roast 15\u201318 min until salmon flakes easily. Add broccoli to the tray after the first 5 min of roasting \u2014 drizzle with 2 tbsp teriyaki sauce.", "Divide brown rice into 4 meal prep containers. Top each with a salmon fillet and roasted broccoli. Drizzle remaining teriyaki sauce over.", "Garnish with spring onion. Keeps refrigerated up to 3 days. Note: salmon's fat is omega-3 (DHA/EPA) \u2014 the most anti-inflammatory fat you can eat.", "\ud83d\udca1 Add 1 tsp fresh grated ginger (or \u00bd tsp ground) \u2014 reduces post-workout muscle soreness (DOMS) and supports digestion."]}, "bf5": {"id": "bf5", "name": "\ud83e\udd5a Egg, Beef & Cheese Breakfast Bowl", "category": "breakfast", "subtitle": "Stovetop \u00b7 batch cook", "perPortion": {"kcal": 634, "protein": 59.9, "carbs": 52.6, "fat": 19.7}, "portions": 7, "batchItems": [{"qty": 900, "unit": "g", "label": "95/5 lean ground beef (raw)"}, {"qty": 14, "unit": "whole", "label": "Large eggs"}, {"qty": 350, "unit": "g", "label": "Wholegrain brown rice (dry)"}, {"qty": 100, "unit": "g", "label": "Fat-free cheddar (shredded)"}, {"qty": 100, "unit": "g", "label": "Fat-free mozzarella (shredded)"}, {"qty": 420, "unit": "g", "label": "Baby spinach"}, {"qty": 700, "unit": "g", "label": "Cherry tomatoes"}, {"qty": 560, "unit": "g", "label": "Bell pepper, red (diced)"}], "steps": ["Add rice and water to a rice cooker. Let cook fully.", "In a large nonstick skillet, cook the ground beef with diced bell pepper until fully browned. Season with salt and pepper. Remove and set aside.", "Using the same skillet, scramble the eggs until fully cooked. Set aside.", "Once rice is done, transfer beef, eggs, and rice to a large bowl and mix well.", "Weigh total mixture in grams, divide equally into containers.", "Top each container with cheddar and mozzarella cheese, halved cherry tomatoes, and fresh baby spinach.", "Optional: pack a small portion of sugar-free syrup on the side for a sweet-savoury combo.", "\ud83d\udfe1 Add \u00bc tsp turmeric and a pinch of black pepper while cooking \u2014 activates curcumin absorption (piperine effect) for anti-inflammatory benefit.", "\ud83d\udca1 Add 1 tsp fresh grated ginger (or \u00bd tsp ground) \u2014 reduces post-workout muscle soreness (DOMS) and supports digestion."]}, "m43": {"id": "m43", "name": "\ud83e\udd5a Egg White Frittata & Roasted Potatoes", "category": "main", "subtitle": "Liquid egg whites \u00b7 whole eggs \u00b7 baby potatoes \u00b7 spinach \u00b7 pepper", "perPortion": {"kcal": 318, "protein": 33.5, "carbs": 25.4, "fat": 8.6}, "portions": 7, "batchItems": [{"qty": 1400, "unit": "g", "label": "Liquid egg whites"}, {"qty": 4, "unit": "whole", "label": "Large whole eggs"}, {"qty": 700, "unit": "g", "label": "Baby potatoes (halved)"}, {"qty": 400, "unit": "g", "label": "Baby spinach"}, {"qty": 1, "unit": "whole", "label": "Red bell pepper"}, {"qty": 1, "unit": "whole", "label": "Yellow onion"}, {"qty": 4, "unit": "whole", "label": "Garlic cloves"}, {"qty": 150, "unit": "g", "label": "Feta cheese"}], "steps": ["Preheat oven to 190\u00b0C. Toss halved baby potatoes with salt, pepper, garlic, and a spray of water. Line tray with baking paper. Roast 25\u201330 min until golden.", "Dice onion and bell pepper. Saut\u00e9 in a non-stick oven-safe pan until softened \u2014 5 min. Add garlic, cook 1 min more.", "Add spinach and stir until wilted. Remove from heat.", "Whisk egg whites and whole eggs together. Season with salt, pepper, and a pinch of paprika. Stir in crumbled feta.", "Pour egg mixture over the vegetables in the pan. Bake at 190\u00b0C for 20\u201322 min until set and lightly golden.", "Cool, cut frittata into portions. Serve each with a portion of roasted potatoes."]}, "bf11": {"id": "bf11", "name": "\ud83e\uded0 Protein Smoothie Bowl", "category": "breakfast", "subtitle": "No cook \u00b7 5 min", "perPortion": {"kcal": 295, "protein": 45, "carbs": 22.4, "fat": 2.8}, "portions": 1, "batchItems": [{"qty": 30, "unit": "g", "label": "Chocolate protein powder"}, {"qty": 200, "unit": "g", "label": "0% Greek yogurt"}, {"qty": 100, "unit": "g", "label": "Frozen mixed berries"}, {"qty": 50, "unit": "mL", "label": "Unsweetened almond milk"}], "steps": ["Add Greek yogurt, protein powder, frozen berries, and almond milk to a blender.", "Blend on high until thick and smooth \u2014 thicker than a drink. Add more milk only if needed.", "Pour into a bowl.", "Top with mixed seeds, coconut flakes, crushed nuts, or more berries. Serve immediately."]}, "m128": {"id": "m128", "name": "\ud83e\uddc6 Greek Turkey Meatballs & Tzatziki Rice Bowl", "category": "main", "subtitle": "Oven \u00b7 35 min", "perPortion": {"kcal": 544, "protein": 41.9, "carbs": 54.1, "fat": 17.3}, "allergens": ["Dairy", "Gluten / Wheat"], "portions": 1, "batchItems": [{"qty": 150, "unit": "g", "label": "Ground turkey (93% lean, raw)"}, {"qty": 10, "unit": "g", "label": "Panko breadcrumbs"}, {"qty": 1.5, "unit": "g", "label": "Garlic (minced)"}, {"qty": 3, "unit": "g", "label": "Parsley (chopped)"}, {"qty": 0.5, "unit": "g", "label": "Oregano (dried)"}, {"qty": 0.3, "unit": "g", "label": "Cumin (ground)"}, {"qty": 3, "unit": "ml", "label": "Olive oil"}, {"qty": 50, "unit": "g", "label": "Brown rice (dry)"}, {"qty": 75, "unit": "g", "label": "Greek yogurt (0% fat)"}, {"qty": 50, "unit": "g", "label": "Cucumber (grated, squeezed)"}, {"qty": 1, "unit": "g", "label": "Dill (fresh)"}, {"qty": 2.5, "unit": "ml", "label": "Lemon juice"}, {"qty": 50, "unit": "g", "label": "Cherry tomatoes (halved)"}], "steps": ["Cook the brown rice and let it steam dry with the lid off.", "Mix the turkey with the panko, garlic, parsley, oregano, cumin, \u00bd tsp salt and plenty of pepper. Work it just until it holds \u2014 overworking makes meatballs bouncy.", "Roll into 5\u20136 balls per serving with wet hands, brush with the oil, and bake at 200\u00b0C for 18\u201320 min until 74\u00b0C inside and browned on top.", "Grate the cucumber, salt it, and squeeze it dry in your fist \u2014 this is the whole difference between tzatziki and yogurt soup. Stir into the yogurt with the dill and lemon.", "Rice in the box, meatballs on top, tomatoes alongside.", "\ud83d\udca1 Tzatziki in its own pot; the meatballs reheat, it doesn't.", "\ud83d\udca1 The book's version was 113 g of turkey and 'a side of veg or rice'. 150 g and the rice built in makes it a complete 42 g-protein main."]}, "hol7": {"id": "hol7", "name": "\u2764\ufe0f Salmon & Asparagus with Lemon-Dill Quinoa", "category": "main", "subtitle": "Batch roasted \u00b7 ~40 min", "perPortion": {"kcal": 601, "protein": 47.2, "carbs": 42.6, "fat": 25.5}, "portions": 7, "batchItems": [{"qty": 1120, "unit": "g", "label": "Salmon fillets (skin-on)"}, {"qty": 385, "unit": "g", "label": "Quinoa (dry)"}, {"qty": 700, "unit": "g", "label": "Asparagus spears"}, {"qty": 350, "unit": "g", "label": "0% Greek yogurt (sauce)"}, {"qty": 40, "unit": "g", "label": "Capers"}, {"qty": 100, "unit": "mL", "label": "Lemon juice"}, {"qty": 7, "unit": "g", "label": "Olive oil"}, {"qty": 15, "unit": "g", "label": "Fresh dill"}, {"qty": 3, "unit": "whole", "label": "Garlic cloves"}], "steps": ["Preheat oven to 200\u00b0C. Line a large baking tray with parchment.", "Lay salmon fillets skin-side down on the tray. Season with salt, pepper, and lemon zest.", "Toss asparagus with olive oil, minced garlic, salt, and pepper. Arrange around the salmon.", "Roast for 15\u201318 min until salmon flakes easily and asparagus is lightly charred.", "Cook quinoa: rinse dry quinoa, cook 1:2 with water ~15 min. Fluff with fork. Fold in chopped dill and lemon juice.", "Make lemon-dill yogurt sauce: mix Greek yogurt, lemon juice, dill, capers, salt, and pepper.", "Portion quinoa across containers. Add a salmon fillet (skin-off) and asparagus spears to each.", "Spoon lemon-dill yogurt sauce over each portion. Refrigerate. Best consumed within 3 days."]}, "m27": {"id": "m27", "name": "\ud83e\udd5a Sweet Potato Veggie Egg Bake", "category": "main", "subtitle": "Oven \u00b7 75 min", "perPortion": {"kcal": 343, "protein": 28.2, "carbs": 28, "fat": 13.1}, "portions": 4, "batchItems": [{"qty": 400, "unit": "g", "label": "Large sweet potato"}, {"qty": 1, "unit": "whole", "label": "Zucchini (sliced)"}, {"qty": 150, "unit": "g", "label": "Asparagus (chopped)"}, {"qty": 150, "unit": "g", "label": "Cherry tomatoes (halved)"}, {"qty": 8, "unit": "whole", "label": "Large eggs"}, {"qty": 15, "unit": "g", "label": "Parmesan (grated)"}, {"qty": 300, "unit": "g", "label": "Fat-free cottage cheese"}], "steps": ["Preheat oven to 200\u00b0C (400\u00b0F). Bake whole sweet potato for 45 min until completely soft. Allow to cool slightly.", "Reduce oven to 180\u00b0C (350\u00b0F).", "Place the soft sweet potato in a 9-inch baking dish and smash it flat with a fork to cover the base evenly.", "Layer sliced zucchini, chopped asparagus, and halved cherry tomatoes over the sweet potato base.", "Crack the eggs over the vegetables. Dollop cottage cheese around the dish. Sprinkle with Parmesan and season with salt and pepper.", "Bake 30 min until eggs are set and the top is golden. Slice into portions."]}, "m57": {"id": "m57", "name": "\ud83c\udf57 Herb Chicken Bowl with Sweet Potato & Vegetables", "category": "main", "subtitle": "Air Fryer \u00b7 batch cook", "perPortion": {"kcal": 547, "protein": 61.2, "carbs": 62.2, "fat": 6.7}, "portions": 7, "batchItems": [{"qty": 1260, "unit": "g", "label": "Chicken breast (skinless, raw)"}, {"qty": 1260, "unit": "g", "label": "Sweet potato (cubed, raw)"}, {"qty": 700, "unit": "g", "label": "Broccoli (florets)"}, {"qty": 700, "unit": "g", "label": "Mixed bell peppers (sliced)"}, {"qty": 560, "unit": "g", "label": "Fat-free cottage cheese (topping)"}, {"qty": 14, "unit": "g", "label": "Italian herb seasoning"}, {"qty": 7, "unit": "g", "label": "Paprika (sprinkle on CC)"}, {"qty": 560, "unit": "g", "label": "Baby spinach"}, {"qty": 1050, "unit": "g", "label": "Cherry tomatoes"}], "steps": ["Season chicken with Italian herb seasoning, salt, and pepper.", "Air fry chicken at 200\u00b0C for 18\u201320 min, flipping halfway. Check 75\u00b0C. Rest 3 min and slice.", "Cube sweet potato into 2cm pieces. Air fry at 200\u00b0C for 20\u201325 min until golden.", "Spray broccoli, sliced peppers, and baby spinach (toss in last 2 min). Air fry at 200\u00b0C for 8\u201310 min until tender-crisp.", "Weigh total batch. Divide chicken, sweet potato, veg, and halved cherry tomatoes evenly into 7 containers.", "Top each with 80g fat-free cottage cheese and a paprika sprinkle. Add fresh just before eating."]}, "bf8": {"id": "bf8", "name": "\ud83e\uded9 Greek Yogurt Protein Bowl", "category": "breakfast", "subtitle": "No cook \u00b7 2 min", "perPortion": {"kcal": 245, "protein": 23.7, "carbs": 19.8, "fat": 8.8}, "portions": 1, "batchItems": [{"qty": 200, "unit": "g", "label": "0% Greek yogurt"}, {"qty": 15, "unit": "g", "label": "Mixed seeds"}, {"qty": 80, "unit": "g", "label": "Mixed berries (fresh or frozen)"}], "steps": ["Spoon of plain 0% Greek yogurt into a bowl.", "Top with mixed seeds and berries.", "Avoid flavoured yogurts \u2014 they add unnecessary sugar. (optional \u2014 not counted in the macros)", "Optional: add a scoop of unflavoured protein powder for extra protein."]}, "m88": {"id": "m88", "name": "\ud83c\udf6f Honey Garlic Chicken & Rice", "category": "main", "subtitle": "Oven \u00b7 40 min \u00b7 4 servings", "perPortion": {"kcal": 416, "protein": 34.7, "carbs": 60.3, "fat": 3.6}, "portions": 4, "batchItems": [{"qty": 440, "unit": "g", "label": "Chicken breast (raw)"}, {"qty": 200, "unit": "g", "label": "Jasmine rice (dry)"}, {"qty": 280, "unit": "g", "label": "Broccoli florets"}, {"qty": 120, "unit": "g", "label": "0% Greek yogurt"}, {"qty": 60, "unit": "g", "label": "Honey"}, {"qty": 50, "unit": "mL", "label": "Low-sodium soy sauce"}, {"qty": 20, "unit": "g", "label": "Garlic (minced)"}], "steps": ["Pre le", "label": "Large onion (diced)"}, {"qty": 6, "unit": "whole", "label": "Garlic cloves (minced)"}, {"qty": 20, "unit": "g", "label": "Fresh ginger (grated, 2 tbsp)"}, {"qty": 1000, "unit": "mL", "label": "Vegetable broth"}, {"qty": 2, "unit": "tsp", "label": "Turmeric (tsp)"}, {"qty": 2, "unit": "tsp", "label": "Cumin (tsp)"}, {"qty": 1, "unit": "tsp", "label": "Coriander powder (tsp)"}, {"qty": 7, "unit": "mL", "label": "Olive oil"}, {"qty": 400, "unit": "g", "label": "0% Greek yogurt (stirred in to serve)"}, {"qty": 400, "unit": "g", "label": "Fat-free cottage cheese"}], "steps": ["Rinse red lentils thoroughly under cold water until water runs clear.", "Heat olive oil in a large pot over medium-high. Saut\u00e9 onion 5 min until golden. Add garlic and ginger, cook 2 min.", "Add turmeric, cumin, and coriander. Stir for 30 seconds until fragrant.", "Add rinsed lentils, crushed tomatoes, coconut milk, and vegetable broth. Stir well. Bring to a boil.", "Reduce heat, cover, and simmer 25\u201330 min, stirring occasionally, until lentils are completely dissolved and creamy.", "Stir in frozen spinach. Cook 5 min more until wilted. Season generously with salt and black pepper.", "Portion into containers. Add a dollop of Greek yogurt and a spoonful of cottage cheese on top of each portion. Dahl thickens as it cools \u2014 stir in a splash of water when reheating.", "\ud83d\udd2c Leucine note: lentils are leucine-light (plant proteins sit below the 2.5g/meal threshold needed to trigger muscle protein synthesis). The Greek yogurt and cottage cheese added here bring each portion above that threshold \u2014 don't skip them if muscle growth is your goal."]}, "bf22": {"id": "bf22", "name": "\ud83e\udd65 Mango Coconut Overnight Oats", "category": "breakfast", "subtitle": "No cook \u00b7 Overnight", "perPortion": {"kcal": 680, "protein": 54.8, "carbs": 77.2, "fat": 18}, "portions": 1, "batchItems": [{"qty": 40, "unit": "g", "label": "Oats (rolled, dry)"}, {"qty": 200, "unit": "ml", "label": "Coconut water"}, {"qty": 80, "unit": "g", "label": "Mango"}, {"qty": 20, "unit": "g", "label": "Almonds"}, {"qty": 30, "unit": "g", "label": "Granola (low-sugar)"}, {"qty": 30, "unit": "g", "label": "Whey protein powder (vanilla)"}, {"qty": 150, "unit": "g", "label": "Greek Yogurt (0% fat)"}], "steps": ["Whisk the whey protein powder into the coconut water (or oat milk) until smooth, straight from the fridge.", "Stir in the oats and Greek yogurt, then transfer to a jar.", "Cover and refrigerate overnight or at least 4 hours.", "In the morning, top with diced mango, coconut flakes, crushed almonds, and granola. (optional \u2014 not counted in the macros)"]}, "m49": {"id": "m49", "name": "\ud83e\udd90 Prawn & Avocado Rice Bowl", "category": "main", "subtitle": "King prawns \u00b7 jasmine rice \u00b7 avocado \u00b7 mango \u00b7 lime-chilli dressing", "perPortion": {"kcal": 635, "protein": 58, "carbs": 76.4, "fat": 13.3}, "portions": 7, "batchItems": [{"qty": 1750, "unit": "g", "label": "Raw king prawns (peeled)"}, {"qty": 525, "unit": "g", "label": "Wholegrain brown rice (dry)"}, {"qty": 3, "unit": "whole", "label": "Ripe avocados"}, {"qty": 2, "unit": "whole", "label": "Mangoes (ripe)"}, {"qty": 3, "unit": "whole", "label": "Limes"}, {"qty": 4, "unit": "whole", "label": "Garlic cloves"}, {"qty": 1, "unit": "whole", "label": "Red chilli (fresh)"}, {"qty": 30, "unit": "g", "label": "Fresh cilantro"}], "steps": ["Cook brown rice in rice cooker.", "Make the dressing: juice 2 of the limes and mix with the finely minced chilli, garlic, a pinch of salt, and chopped cilantro.", "Pat prawns dry. Cook in a hot pan with garlic spray for 2 min per side until pink. Toss with half the dressing.", "Dice the mango and slice the avocado. Toss gently with the juice of the remaining lime to stop the avocado browning.", "Portion rice into containers. Top with prawns, mango, and avocado.", "Drizzle remaining dressing over each bowl. Add fresh cilantro to garnish.", "\ud83d\udfe1 Add \u00bc tsp turmeric and a pinch of black pepper while cooking \u2014 activates curcumin absorption (piperine effect) for anti-inflammatory benefit.", "\ud83d\udca1 Add 1 tsp fresh grated ginger (or \u00bd tsp ground) \u2014 reduces post-workout muscle soreness (DOMS) and supports digestion."]}, "pw2": {"id": "pw2", "name": "\ud83c\udf4c Banana & Oat Protein Smoothie", "category": "smoothie", "subtitle": "Banana \u00b7 oats \u00b7 protein powder \u00b7 almond milk", "perPortion": {"kcal": 334, "protein": 30, "carbs": 46, "fat": 4.6}, "portions": 7, "batchItems": [{"qty": 7, "unit": "whole", "label": "Bananas (ripe, frozen)"}, {"qty": 125, "unit": "g", "label": "Rolled oats"}, {"qty": 7, "unit": "whole", "label": "Whey or plant protein powder (vanilla)"}, {"qty": 1750, "unit": "mL", "label": "Unsweetened almond milk"}], "steps": ["Freeze bananas in advance \u2014 peel and bag them whole.", "Each serving: blend the frozen banana, oats, protein powder, and almond milk.", "Blend 45 seconds until smooth. Drink immediately.", "Can batch-prep oat+powder portions in zip bags for fast morning assembly.", "\u23f1\ufe0f Timing: drink 60\u201375 min before training for optimal fuel. If training within 30 min, skip the oats and use just banana + protein powder + milk \u2014 faster to digest."]}, "ds5": {"id": "ds5", "name": "\ud83c\udf4c Protein Banana Bread", "category": "dessert", "subtitle": "Oven \u00b7 50 min", "perPortion": {"kcal": 182, "protein": 14.2, "carbs": 22.1, "fat": 4.6}, "portions": 8, "batchItems": [{"qty": 300, "unit": "g", "label": "Banana (medium)"}, {"qty": 120, "unit": "g", "label": "Oat flour"}, {"qty": 90, "unit": "g", "label": "Whey protein powder"}, {"qty": 2, "unit": "whole", "label": "Large eggs"}, {"qty": 20, "unit": "g", "label": "Peanut butter (natural)"}, {"qty": 3, "unit": "g", "label": "Cinnamon (ground)"}, {"qty": 15, "unit": "g", "label": "Honey"}, {"qty": 8, "unit": "g", "label": "Baking Powder"}], "steps": ["Preheat oven to 170\u00  "category": "breakfast", "subtitle": "No cook \u00b7 5 min", "perPortion": {"kcal": 616, "protein": 46.6, "carbs": 71.6, "fat": 17.3}, "portions": 1, "batchItems": [{"qty": 70, "unit": "g", "label": "Tortilla (flour, 25cm)"}, {"qty": 80, "unit": "g", "label": "Banana (medium)"}, {"qty": 20, "unit": "g", "label": "Peanut butter (natural)"}, {"qty": 5, "unit": "g", "label": "Honey"}, {"qty": 2, "unit": "g", "label": "Cinnamon (ground)"}, {"qty": 150, "unit": "g", "label": "Greek Yogurt (0% fat)"}, {"qty": 25, "unit": "g", "label": "Whey protein powder"}], "steps": ["Warm tortilla in a dry pan or microwave 20 seconds.", "Spread peanut butter evenly across tortilla.", "Whisk the whey protein powder into the cold Greek yogurt until smooth, then spread it over the peanut butter.", "Place whole peeled banana at one edge.", "Drizzle honey and sprinkle cinnamon. Crushed almonds are optional \u2014 not counted in the macros, and they add tree nuts.", "Roll tightly and slice on the diagonal."]}, "m46": {"id": "m46", "name": "\ud83c\udf57 Greek Chicken & Orzo Bowl", "category": "main", "subtitle": "Chicken breast \u00b7 orzo \u00b7 cucumber \u00b7 tomato \u00b7 olives \u00b7 lemon-herb", "perPortion": {"kcal": 597, "protein": 53.3, "carbs": 59.2, "fat": 14.8}, "portions": 7, "batchItems": [{"qty": 1260, "unit": "g", "label": "Chicken breast (raw)"}, {"qty": 490, "unit": "g", "label": "Orzo pasta (dry)"}, {"qty": 2, "unit": "whole", "label": "Cucumbers"}, {"qty": 350, "unit": "g", "label": "Cherry tomatoes"}, {"qty": 140, "unit": "g", "label": "Kalamata olives (pitted)"}, {"qty": 140, "unit": "g", "label": "Reduced-fat feta cheese"}, {"qty": 2, "unit": "whole", "label": "Lemons"}, {"qty": 4, "unit": "whole", "label": "Garlic cloves"}, {"qty": 6, "unit": "g", "label": "Dried oregano"}], "steps": ["Marinate chicken in lemon juice, minced garlic, dried oregano, salt, and pepper for at least 30 min.", "Preheat oven to 200\u00b0C or heat grill pan. Cook chicken 22\u201325 min until 74\u00b0C internally. Rest and slice.", "Cook orzo in boiling salted water until al dente (~9 min). Drain and cool slightly.", "Dice cucumber. Halve tomatoes. Halve olives.", "Toss orzo with cucumber, tomatoes, olives, feta, lemon juice, .", "Weigh sliced chicken, divide equally. Portion over orzo salad in containers."]}, "m03": {"id": "m03", "name": "\ud83c\udf57 Marry Me Chicken \u2014 Pasta", "category": "main", "subtitle": "Pasta \u00b7 mushrooms \u00b7 peas & carrots \u00b7 highest protein", "perPortion": {"kcal": 753, "protein": 75.7, "carbs": 87.9, "fat": 10.2}, "portions": 7, "batchItems": [{"qty": 1400, "unit": "g", "label": "Chicken breast (raw)"}, {"qty": 550, "unit": "g", "label": "Pasta (any shape)"}, {"qty": 233, "unit": "g", "label": "Fat-free cottage cheese"}, {"qty": 287, "unit": "g", "label": "0% Greek yogurt"}, {"qty": 58, "unit": "g", "label": "Parmesan (grated)"}, {"qty": 146, "unit": "g", "label": "Sun-dried tomatoes (no oil)"}, {"qty": 80, "unit": "g", "label": "Spinach"}, {"qty": 350, "unit": "g", "label": "Mushrooms (sliced)"}, {"qty": 350, "unit": "g", "label": "Frozen peas"}, {"qty": 210, "unit": "g", "label": "Carrots (diced)"}, {"qty": 1, "unit": "whole", "label": "Onion"}, {"qty": 25, "unit": "g", "label": "Minced garlic"}, {"qty": 280, "unit": "mL", "label": "Bone broth or chicken stock (1 Knorr cube + 280mL water)"}], "steps": ["Add chicken, mushrooms, onion, garlic, sun-dried tomatoes, stock and seasonings to slow cooker. Cook LOW 4hr / HIGH 2.5hr.", "Cook pasta separately. Mix in peas and carrots last 2 min. Fold in spinach off heat.", "Blend fat-free cottage cheese, Greek yogurt, parmesan and seasonings until smooth.", "Shred chicken. Add blended sauce. Mix well.", "Combine chicken mix with pasta-veg mix. Divide into containers. ", "\ud83d\udfe1 Add \u00bc tsp turmeric and a pinch of black pepper while cooking \u2014 activates curcumin absorption (piperine effect) for anti-inflammatory benefit.", "\ud83d\udca1 Add 1 tsp fresh grated ginger (or \u00bd tsp ground) \u2014 reduces post-workout muscle soreness (DOMS) and supports digestion."]}, "m06": {"id": "m06", "name": "\ud83c\udf57 Honey Chipotle Chicken Bowl", "category": "main", "subtitle": "Slow-cooked chicken \u00b7 honey chipotle \u00b7 jasmine rice", "perPortion": {"kcal": 812, "protein": 89, "carbs": 82.3, "fat": 13}, "portions": 7, "batchItems": [{"qty": 1955, "unit": "g", "label": "Chicken breast (raw)"}, {"qty": 400, "unit": "g", "label": "Wholegrain brown rice (dry)"}, {"qty": 390, "unit": "g", "label": "Fat-free cottage cheese"}, {"qty": 75, "unit": "g", "label": "Pr\u00e9sident Light mozzarella"}, {"qty": 25, "unit": "g", "label": "Parmesan"}, {"qty": 84, "unit": "mL", "label": "Baladna skimmed milk"}, {"qty": 198, "unit": "g", "label": "Chipotle peppers in adobo"}, {"qty": 168, "unit": "g", "label": "Tomato sauce"}, {"qty": 42, "unit": "g", "label": "Raw honey"}, {"qty": 20, "unit": "g", "label": "Garlic cloves"}, {"qty": 560, "unit": "g", "label": "Black beans (canned, drained)"}, {"qty": 560, "unit": "g", "label": "Baby spinach"}], "steps": ["Slow cooker: add chicken, chipotle peppers, honey and seasonings. Cook HIGH 3hr.", "Blend fat-free cottage cheese, Pr\u00e9sident Light mozzarella, parmesan, tomato sauce, garlic, milk and remaining honey until smooth.", "Cook brown rice.", "Shred chicken. Stir in drained black beans and baby spinach until spinach wilts. Pour blended sauce in and mix well.", "Divide rice equally into bowls. Top with chicken mix. ", "\ud83d\udfe1 Add \u00bc tsp turmeric and a pinch of black pepper while cooking \u2014 activates curcumin absorption (piperine effect) for anti-inflammatory benefit.", "\ud83d\udca1 Add 1 tsp fresh grated ginger (or \u00bd tsp ground) \u2014 reduces post-workout muscle soreness (DOMS) and supports digestion."]}, "m95": {"id": "m95", "name": "\ud83e\udd66 Honey Garlic Baked Chicken & Broccoli", "category": "main", "subtitle": "Oven \u00b7 40 min \u00b7 4 servings", "perPortion": {"kcal": 436, "protein": 37.6, "carbs": 60, "fat": 5.3}, "portions": 4, "batchItems": [{"qty": 520, "unit": "g", "label": "Chicken breast (raw)"}, {"qty": 200, "unit": "g", "label": "Brown rice (dry)"}, {"qty": 400, "unit": "g", "label": "Broccoli florets"}, {"qty": 60, "unit": "g", "label": "Honey"}, {"qty": 60, "unit": "mL", "label": "Low-sodium soy sauce"}, {"qty": 20, "unit": "g", "label": "Garlic (minced)"}], "steps": ["Preheat oven to 200\u00b0C (400\u00b0F). Whisk together honey, soy sauce, and minced garlic to make the dump-and-bake sauce.", "Place chicken breasts in a baking dish. Pour \u00be of the sauce over the chicken. Arrange broccoli florets around the chicken and drizzle remaining sauce over.", "Bake uncovered 30\u201335 min until chicken reaches 74\u00b0C (165\u00b0F) internally and broccoli is caramelised. No oil needed \u2014 the honey sauce keeps everything moist and sticky.", "Cook brown rice per packet instructions.", "Slice chicken and divide into 4 meal prep containers with brown rice and broccoli. Spoon over any sauce from the baking dish.", "\ud83d\udca1 Add 1 tsp fresh grated ginger (or \u00bd tsp ground) \u2014 reduces post-workout muscle soreness (DOMS) and supports digestion."]}, "bf31": {"id": "bf31", "name": "\ud83e\udd5a Clean Egg White Omelette", "category": "breakfast", "subtitle": "Stovetop \u00b7 12 min", "perPortion": {"kcal": 389, "protein": 39.2, "carbs": 38.5, "fat": 9.3}, "portions": 1, "batchItems": [{"qty": 200, "unit": "g", "label": "Egg whites (raw)"}, {"qty": 60, "unit": "g", "label": "Baby spinach"}, {"qty": 80, "unit": "g", "label": "Mushrooms (white button)"}, {"qty": 100, "unit": "g", "label": "Pumpkin"}, {"qty": 30, "unit": "g", "label": "Feta cheese"}, {"qty": 60, "unit": "g", "label": "Bread (whole wheat)"}], "steps": ["Roast pumpkin cubes at 200\u00b0C for 15 min.", "Saut\u00e9 mushrooms and spinach in a spritz of oil.", "Whisk egg whites with salt and pepper.", "Pour egg whites into pan, cook on medium until mostly set.", "Add veggies and feta to one half, fold, and serve with toast.", "\ud83d\udca1 Add 1 tsp fresh grated ginger (or \u00bd tsp ground) \u2014 reduces post-workout muscle soreness (DOMS) and supports digestion."]}, "m47": {"id": "m47", "name": "\ud83c\udf57 Teriyaki Chicken & Edamame Rice", "category": "main", "subtitle": "Chicken breast \u00b7 jasmine rice \u00b7 edamame \u00b7 broccoli \u00b7 teriyaki glaze", "perPortion": {"kcal": 713, "protein": 71.5, "carbs": 81.8, "fat": 12}, "portions": 7, "batchItems": [{"qty": 1575, "unit": "g", "label": "Chicken breast (raw)"}, {"qty": 465, "unit": "g", "label": "Wholegrain brown rice (dry)"}, {"qty": 420, "unit": "g", "label": "Frozen edamame (shelled)"}, {"qty": 700, "unit": "g", "label": "Broccoli florets"}, {"qty": 80, "unit": "mL", "label": "Low-sodium soy sauce"}, {"qty": 42, "unit": "g", "label": "Honey"}, {"qty": 20, "unit": "g", "label": "Fresh ginger (grated)"}, {"qty": 4, "unit": "whole", "label": "Garlic cloves"}, {"qty": 14, "unit": "g", "label": "Cornstarch"}, {"qty": 700, "unit": "g", "label": "Snap peas"}, {"qty": 1050, "unit": "g", "label": "Bok choy (halved)"}], "steps": ["Cook brown rice in rice cooker. Cook edamame in boiling water 4 min, drain.", "Slice chicken into strips. Season with salt and pepper.", "Make teriyaki sauce: combine soy sauce, honey, garlic, ginger, and cornstarch mixed with cold water.", "Cook chicken in a non-stick pan over medium-high heat until cooked through \u2014 6\u20138 min. Set aside.", "Blanch broccoli, snap peas, and bok choy 3 min. Drain.", "Return chicken to pan, pour teriyaki sauce over. Toss on medium heat until sauce thickens and coats chicken \u2014 2 min.", "Portion rice, teriyaki chicken, broccoli, snap peas, bok choy, and edamame across containers.", "\ud83d\udfe1 Add \u00bc tsp turmeric and a pinch of black pepper while cooking \u2014 activates curcumin absorption (piperine effect) for anti-inflammatory benefit."]}, "v4": {"id": "v4", "name": "\ud83e\udd57 Greek Yogurt Egg & Veggie Protein Bowl", "category": "main", "subtitle": "Scrambled eggs \u00b7 cottage cheese \u00b7 roasted veggies \u00b7 quinoa", "perPortion": {"kcal": 640, "protein": 43.7, "carbs": 62, "fat": 24.2}, "portions": 5, "batchItems": [{"qty": 10, "unit": "whole", "label": "Large eggs"}, {"qty": 400, "unit": "g", "label": "Cottage cheese (low fat)"}, {"qty": 350, "unit": "g", "label": "Quinoa (dry)"}, {"qty": 400, "unit": "g", "label": "Broccoli florets"}, {"qty": 300, "unit": "g", "label": "Red capsicum (diced)"}, {"qty": 200, "unit": "g", "label": "Kale or baby spinach"}, {"qty": 1, "unit": "tsp", "label": "Garlic powder (tsp)"}, {"qty": 60, "unit": "g", "label": "Parmesan or feta (crumbled)"}, {"qty": 14, "unit": "g", "label": "Butter"}], "steps": ["Preheat oven to 200\u00b0C (400\u00b0F). Toss broccoli and capsicum with garlic powder, salt, and pepper. Spread on a baking tray and roast 25 min until golden.", "Cook quinoa: rinse, then simmer in water or veggie broth for 15 min until fluffy. Fluff with a fork.", "Whisk eggs with a pinch of salt. In a non-stick pan over low-medium heat, add a small knob of butter and scramble eggs very slowly \u2014 pull them off heat while still slightly glossy for the best texture.", "Stir cottage cheese into the warm scrambled eggs off heat. The residual heat will warm the cottage cheese without curdling it.", "Wilt kale or spinach in the same pan for 2 min with a splash of water.", "Divide quinoa into containers. Layer roasted veg, then egg-cottage cheese mixture, then wilted greens.", "Top each container with crumbled feta or Parmesan. Refrigerate \u2014 eat within 3 days for best egg texture."]}, "ds8": {"id": "ds8", "name": "\ud83c\udf52 Protein Cherry Cheesecakes", "category": "dessert", "subtitle": "No-bake \u00b7 20 min + chill", "perPortion": {"kcal": 361, "protein": 28.2, "carbs": 38.6, "fat": 10.4}, "allergens": ["Dairy", "Gluten / Wheat"], "portions": 1, "batchItems": [{"qty": 125, "unit": "g", "label": "Greek yogurt (0% fat)"}, {"qty": 25, "unit": "g", "label": "Cream cheese (light)"}, {"qty": 25, "unit": "g", "label": "Cream cheese (fat-free)"}, {"qty": 10, "unit": "g", "label": "Vanilla whey protein"}, {"qty": 18, "unit": "g", "label": "Graham crackers (crushed)"}, {"qty": 3, "unit": "g", "label": "Butter (melted)"}, {"qty": 62.5, "unit": "g", "label": "Cherries (frozen or fresh)"}, {"qty": 5, "unit": "g", "label": "Honey"}, {"qty": 1.25, "unit": "g", "label": "Vanilla extract"}, {"qty": 2, "unit": "g", "label": "Cornstarch"}], "steps": ["Mix the crushed graham crackers with the melted butter and press firmly into the base of a small container. Press harder than feels necessary \u2014 a loose base falls apart when you spoon into it.", "Whisk the Greek yogurt, both cream cheeses, protein powder, honey and vanilla until completely smooth.", "Spoon the filling over the base and level the top.", "Simmer the cherries with a splash of water until they soften and release their juice.", "Stir the cornstarch into a little cold water first, then add to the cherries and cook until glossy and thick. Adding dry cornstarch straight to hot fruit gives you lumps.", "Cool the cherry topping completely before it goes anywhere near the filling, or it will melt straight through.", "Spoon over and refrigerate at least 3 hours.", "\ud83d\udca1 Half light and half fat-free cream cheese is deliberate. All fat-free tastes thin and chalky; all light doubles the fat for no extra protein.", "\ud83d\udca1 Keeps 3\u20134 days. Add the cherry layer on the day if you want the base to stay crisp."]}, "m79": {"id": "m79", "name": "\ud83c\udf57 Lemongrass Chicken Coconut Bowl", "category": "main", "subtitle": "Stovetop \u00b7 30 min", "perPortion": {"kcal": 650, "protein": 46.7, "carbs": 57.2, "fat": 26.7}, "portions": 2, "batchItems": [{"qty": 400, "unit": "g", "label": "Chicken thigh (boneless, skinless, raw)"}, {"qty": 120, "unit": "g", "label": "Brown rice (dry)"}, {"qty": 20, "unit": "g <script>
const DATA = JSON.parse(document.getElementById('data').textContent);
const KEY = 'sg_review_' + DATA.generated;
let dec = {}; try { dec = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch (_) {}
let open = null;
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mac = (m, label) => !m ? `<div class="macros"><span>${label}: no figures</span></div>` :
  `<div class="macros"><span>${m.kcal ?? '–'} kcal</span><span class="p">${m.protein ?? '–'} P</span><span>${m.carbs ?? '–'} C</span><span>${m.fat ?? '–'} F</span><span style="color:var(--sub)">${label}</span></div>`;
function save() { localStorage.setItem(KEY, JSON.stringify(dec)); }
function decide(id, d) { dec[id] = { ...(dec[id] || {}), decision: d, ours: (dec[id] || {}).ours || (DATA.candidates.find(c => c.id === id).matches[0] || null) }; save(); render(); }
function note(id, v) { dec[id] = { ...(dec[id] || {}), note: v }; save(); }
function pickOurs(id, lib) { dec[id] = { ...(dec[id] || {}), ours: lib }; save(); render(); }
function toggle(id) { open = open === id ? null : id; render(); }
function libCard(l) {
  if (!l) return '<div class="empty">No matching recipe in the library — nothing to compare.</div>';
  return `<h3>${esc(l.name)}</h3><div class="meta" style="font-size:11px;color:var(--sub)">${esc(l.id)} · ${esc(l.category)} · ${esc(l.subtitle || '')} · ${l.portions || 1} portion(s) as written${l.allergens && l.allergens.length ? ' · ⚠ ' + esc(l.allergens.join(', ')) : ''}</div>
  ${mac(l.perPortion, 'per portion, computed')}
  <h4>INGREDIENTS</h4><ul>${(l.batchItems || []).map(i => `<li>${i.qty} ${esc(i.unit)} ${esc(i.label)}</li>`).join('')}</ul>
  <h4>METHOD</h4><ol>${(l.steps || []).map(s => `<li>${esc(s)}</li>`).join('')}</ol>`;
}
function render() {
  const q = document.getElementById('q').value.toLowerCase(), src = document.getElementById('src').value, flt = document.getElementById('flt').value;
  const list = DATA.candidates.filter(c => {
    if (src !== 'all' && !c.id.startsWith(src)) return false;
    const d = dec[c.id] && dec[c.id].decision;
    if (flt === 'dup' && !c.matches.length) return false;
    if (flt === 'nodup' && c.matches.length) return false;
    if (flt === 'undecided' && d) return false;
    if (flt === 'decided' && !d) return false;
    if (flt === 'built' && !c.built_as) return false;
    if (q && !(c.title + ' ' + c.source + ' ' + c.matches.map(m => DATA.library[m].name).join(' ')).toLowerCase().includes(q)) return false;
    return true;
  });
  const decided = Object.values(dec).filter(d => d.decision).length;
  document.getElementById('stats').innerHTML = `<strong>${list.length}</strong> shown · <strong>${DATA.candidates.length}</strong> candidates · <strong>${decided}</strong> decided`;
  document.getElementById('list').innerHTML = list.length ? list.map(c => {
    const d = dec[c.id] || {}; const cls = d.decision ? d.decision : '';
    const ours = d.ours || c.matches[0]; const l = ours ? DATA.library[ours] : null;
    const drift = c.claim && c.computed && c.claim.kcal ? Math.round((c.computed.kcal - c.claim.kcal) / c.claim.kcal * 100) : null;
    const decLabel = { 'keep-ours': 'KEEP OURS', 'replace': 'REPLACE WITH NEW', 'both': 'KEEP BOTH', 'new': 'BUILD IT', 'skip': 'SKIP' }[d.decision] || 'UNDECIDED';
    return `<div class="cand ${cls} ${open === c.id ? 'open' : ''}">
      <div class="head" onclick="toggle('${c.id}')">
        <div class="t"><b>${esc(c.title)}</b><div class="meta">${esc(c.source)} · serves ${c.serves ?? '?'}${c.matches.length ? ' · matches: ' + c.matches.map(m => esc(DATA.library[m].name)).join(', ') : ' · no library match'}</div></div>
        ${c.built_as ? `<span class="pill built">BUILT · ${esc(c.built_as.split(' ')[0])}</span>` : ''}
        <span class="pill dec-${d.decision || ''}">${decLabel}</span>
      </div>
      <div class="body">
        <div class="cols">
          <div class="col"><h4>NEW — AS POSTED</h4><h3>${esc(c.title)}</h3>
            ${mac(c.claim, 'per serving, as claimed')}${c.computed ? mac(c.computed, 'per serving, computed from ingredients') : ''}${c.coverage ? `<div class="meta" style="font-size:11px;color:var(--sub);margin-bottom:8px">${esc(c.coverage)}</div>` : ''}
            ${drift !== null && Math.abs(drift) >= 10 ? `<div class="warn">Post's calories are ${drift > 0 ? 'under' : 'over'}stated by ${Math.abs(drift)}%</div>` : ''}
            ${c.built_as ? `<div class="warn" style="color:var(--green)">Already built as ${esc(c.built_as)}</div>` : ''}
            <h4>INGREDIENTS</h4><ul>${c.ingredients.map(i => `<li>${esc(i)}</li>`).join('')}</ul>
            <h4>METHOD</h4><ol>${c.steps.map(s => `<li>${esc(s)}</li>`).join('')}</ol></div>
          <div class="col"><h4>OURS — IN THE LIBRARY</h4>
            ${c.matches.length > 1 ? `<div class="libpick">${c.matches.map(m => `<button class="${m === ours ? 'on' : ''}" onclick="pickOurs('${c.id}','${m}')">${esc(DATA.library[m].name)}</button>`).join('')}</div>` : ''}
            ${libCard(l)}</div>
        </div>
        <div class="actions">
          ${l ? `<button class="${d.decision === 'keep-ours' ? 'on' : ''}" onclick="decide('${c.id}','keep-ours')">Keep ours</button>
                 <button class="${d.decision === 'replace' ? 'on' : ''}" onclick="decide('${c.id}','replace')">Replace with new</button>
                 <button class="${d.decision === 'both' ? 'on' : ''}" onclick="decide('${c.id}','both')">Keep both</button>`
              : `<button class="${d.decision === 'new' ? 'on' : ''}" onclick="decide('${c.id}','new')">Build it</button>`}
          <button class="${d.decision === 'skip' ? 'on' : ''}" onclick="decide('${c.id}','skip')">Skip</button>
          <textarea placeholder="Note for the build (portion size, swaps, tier…)" onchange="note('${c.id}', this.value)">${esc(d.note || '')}</textarea>
        </div>
      </div></div>`;
  }).join('') : '<div class="empty">Nothing matches.</div>';
}
function payload() {
  return JSON.stringify({ generated: DATA.generated, decisions: Object.fromEntries(Object.entries(dec).filter(([, d]) => d.decision).map(([id, d]) => {
    const c = DATA.candidates.find(x => x.id === id); return [id, { title: c.title, decision: d.decision, ours: d.ours || c.matches[0] || null, note: d.note || '' }]; })) }, null, 2);
}
function exportDecisions() { navigator.clipboard.writeText(payload()).then(() => { document.getElementById('outmsg').textContent = 'Copied — paste it to Claude.'; }); }
function downloadDecisions() { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([payload()], { type: 'application/json' })); a.download = 'recipe-decisions-' + DATA.generated + '.json'; a.click(); }
render();
</script>
</body>
