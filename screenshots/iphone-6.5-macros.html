<!DOCTYPE html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1242px;min-height:2688px;background:#1e1a16;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Helvetica Neue',sans-serif;color:#f3ece0;overflow:hidden;position:relative}
.sb{height:102px;display:flex;align-items:center;justify-content:space-between;padding:0 99px;font-size:49px;font-weight:600;background:#1e1a16}
.hdr{padding:59px 80px 32px;border-bottom:1px solid rgba(255,255,255,0.06)}
.logo{font-size:72px;font-weight:800;letter-spacing:-0.5px}
.logo .acc{color:#E07B2A}
.logo .wht{color:#f3ece0}
.section-lbl{font-size:39px;font-weight:700;letter-spacing:0.07em;text-transform:uppercase;color:#7a6d5e;padding:43px 80px 16px}
.tab-bar{position:absolute;bottom:0;left:0;right:0;height:255px;background:#2c2520;border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:flex-start;justify-content:space-around;padding-top:37px}
.tab{display:flex;flex-direction:column;align-items:center;gap:8px}
.tab-ico{font-size:70px;line-height:1}
.tab-lbl{font-size:32px;color:#7a6d5e}
.tab-lbl.on{color:#E07B2A}
.card{margin:21px 62px 0;background:#2c2520;border-radius:52px;padding:43px 64px;border:1px solid rgba(255,255,255,0.06)}
.tag{display:inline-block;font-size:32px;padding:8px 27px;border-radius:22px;font-weight:700;margin-right:18px}
.tag.g{background:rgba(74,222,128,0.12);color:#4ade80}
.tag.b{background:rgba(96,165,250,0.12);color:#60a5fa}
.tag.a{background:rgba(224,123,42,0.15);color:#E07B2A}

.ring-wrap{display:flex;justify-content:center;padding:59px 0 21px}
.mc-grid{display:grid;grid-template-columns:1fr 1fr;gap:49px;padding:0 80px 32px}
.mc{background:#2c2520;border-radius:49px;padding:43px 59px;border:1px solid rgba(255,255,255,0.05)}
.mc-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:21px}
.mc-nm{font-size:38px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#7a6d5e}
.mc-pct{font-size:39px;font-weight:800}
.mc-track{height:18px;background:rgba(255,255,255,0.07);border-radius:99px;overflow:hidden;margin-bottom:13px}
.mc-fill{height:100%;border-radius:99px}
.mc-vals{display:flex;justify-content:space-between;font-size:37px}
.log-row{display:flex;align-items:center;padding:29px 80px;border-bottom:1px solid rgba(255,255,255,0.03)}
.log-ico{font-size:64px;margin-right:47px}
.log-nm{font-size:44px;font-weight:600}
.log-tm{font-size:34px;color:#7a6d5e;margin-top:5px}
.log-kc{font-size:44px;font-weight:800;color:#E07B2A}
</style></head><body>
<div class="sb"><span>9:41</span><span style="letter-spacing:2px">●●●●</span></div>
<div class="hdr">
  <div class="logo"><span class="acc">SOUL</span><span class="wht">GAINZ</span> <span style="font-size:49px;color:#b8a890;font-weight:400">— Today's Macros</span></div>
</div>
<div class="ring-wrap">
<svg width="645" height="645" viewBox="0 0 220 220">
  <circle cx="110" cy="110" r="251" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="51"/>
  <circle cx="110" cy="110" r="251" fill="none" stroke="#E07B2A" stroke-width="51"
    stroke-dasharray="1561 1734" stroke-linecap="round" transform="rotate(-90 110 110)"/>
  <text x="110" y="97" text-anchor="middle" font-size="38" font-weight="800" fill="#E07B2A" font-family="-apple-system,sans-serif">2,487</text>
  <text x="110" y="122" text-anchor="middle" font-size="16" fill="#7a6d5e" font-family="-apple-system,sans-serif">of 2,500 kcal</text>
  <text x="110" y="146" text-anchor="middle" font-size="15" fill="#4ade80" font-family="-apple-system,sans-serif">99% — On target ✓</text>
</svg>
</div>
<div class="mc-grid">
  <div class="mc"><div class="mc-hdr"><span class="mc-nm">Protein</span><span class="mc-pct" style="color:#4ade80">98%</span></div><div class="mc-track"><div class="mc-fill" style="width:98%;background:#4ade80"></div></div><div class="mc-vals"><span style="font-weight:700;color:#4ade80">202g</span><span style="color:#7a6d5e">/ 205g</span></div></div>
  <div class="mc"><div class="mc-hdr"><span class="mc-nm">Carbs</span><span class="mc-pct" style="color:#60a5fa">99%</span></div><div class="mc-track"><div class="mc-fill" style="width:99%;background:#60a5fa"></div></div><div class="mc-vals"><span style="font-weight:700;color:#60a5fa">298g</span><span style="color:#7a6d5e">/ 300g</span></div></div>
  <div class="mc"><div class="mc-hdr"><span class="mc-nm">Fat</span><span class="mc-pct" style="color:#f472b6">98%</span></div><div class="mc-track"><div class="mc-fill" style="width:98%;background:#f472b6"></div></div><div class="mc-vals"><span style="font-weight:700;color:#f472b6">54g</span><span style="color:#7a6d5e">/ 55g</span></div></div>
  <div class="mc"><div class="mc-hdr"><span class="mc-nm">Fibre</span><span class="mc-pct" style="color:#fbbf24">72%</span></div><div class="mc-track"><div class="mc-fill" style="width:72%;background:#fbbf24"></div></div><div class="mc-vals"><span style="font-weight:700;color:#fbbf24">18g</span><span style="color:#7a6d5e">/ 25g</span></div></div>
</div>
<div class="section-lbl">Meal log</div>
<div class="log-row"><span class="log-ico">🌅</span><div style="flex:1"><div class="log-nm">Breakfast</div><div class="log-tm">8:12 AM</div></div><span class="log-kc">798</span></div>
<div class="log-row"><span class="log-ico">⚡</span><div style="flex:1"><div class="log-nm">Pre-Workout</div><div class="log-tm">11:30 AM</div></div><span class="log-kc">182</span></div>
<div class="log-row"><span class="log-ico">🍗</span><div style="flex:1"><div class="log-nm">Lunch — Power Bowl</div><div class="log-tm">1:15 PM</div></div><span class="log-kc">640</span></div>
<div class="log-row"><span class="log-ico">🥤</span><div style="flex:1"><div class="log-nm">Whey Smoothie</div><div class="log-tm">4:00 PM</div></div><span class="log-kc">320</span></div>
<div class="tab-bar"><div class="tab"><span class="tab-ico">🍽️</span><span class="tab-lbl">Plan</span></div><div class="tab"><span class="tab-ico">📋</span><span class="tab-lbl">Recipes</span></div><div class="tab"><span class="tab-ico">🛒</span><span class="tab-lbl">Shop</span></div><div class="tab"><span class="tab-ico">💊</span><span class="tab-lbl">Supplements</span></div><div class="tab"><span class="tab-ico">👤</span><span class="tab-lbl on">Profile</span></div></div>
</body></html>
