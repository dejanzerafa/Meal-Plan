<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>SoulGainz — Offline</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      height: 100%;
      background: #1a1209;
      color: #f3ece0;
      font-family: "Instrument Sans", -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 32px;
    }
    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      max-width: 320px;
      width: 100%;
    }
    .logo {
      display: flex;
      flex-direction: row;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
    }
    .logo-text {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.09em;
    }
    .logo-soul { color: #E07B2A; }
    .logo-gainz { color: #f3ece0; }
    h1 {
      font-family: Georgia, "Times New Roman", serif;
      font-size: 22px;
      font-weight: 700;
      color: #f3ece0;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 14px;
      color: #a89880;
      line-height: 1.5;
    }
    .try-again {
      margin-top: 8px;
      background: #b84a1f;
      color: #fff;
      border: none;
      border-radius: 12px;
      padding: 14px 32px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      font-family: inherit;
      letter-spacing: 0.01em;
    }
    .try-again:active {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg width="18" height="28" viewBox="-12 -32 24 44" xmlns="http://www.w3.org/2000/svg">
        <path d="M0,-32 C0,-32 -12,-20 -12,-8 C-12,4 -6,12 0,12 C6,12 12,4 12,-8 C12,-14 8,-20 4,-24 C6,-18 6,-12 6,-8 C6,-2 4,4 0,4 C-4,4 -6,-2 -6,-8 C-6,-18 0,-32 0,-32 Z" fill="#E07B2A"/>
      </svg>
      <div class="logo-text">
        <span class="logo-soul">SOUL</span><span class="logo-gainz">GAINZ</span>
      </div>
    </div>
    <h1>You're offline</h1>
    <p>Check your connection and try again.</p>
    <button class="try-again" onclick="window.location.reload()">Try Again</button>
  </div>
</body>
</html>
