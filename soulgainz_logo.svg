    <tspan style="fill:rgb(224, 123, 42);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:Georgia, &quot;Times New Roman&quot;, serif;font-size:72px;font-weight:400;text-anchor:middle;dominant-baseline:auto">Soul</tspan><tspan style="fill:rgb(232, 221, 208);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Instrument Sans&quot;, Arial, sans-serif;font-size:72px;font-weight:700;text-anchor:middle;dominant-baseline:auto">Gainz</tspan>
