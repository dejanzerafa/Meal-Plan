# Netlify configuration for Meal Prep app

[build]
  publish = "."
  functions = "netlify/functions"
  # Sentry removed — now loaded via CDN loader in index.html (no local file needed)
  command = "mkdir -p vendor && curl --fail -L 'https://unpkg.com/react@18.2.0/umd/react.production.min.js' -o vendor/react.min.js && curl --fail -L 'https://unpkg.com/react-dom@18.2.0/umd/react-dom.production.min.js' -o vendor/react-dom.min.js && curl --fail -L 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js' -o vendor/supabase.min.js && test -s vendor/react.min.js && test -s vendor/react-dom.min.js && test -s vendor/supabase.min.js && echo 'Vendor files OK'"

# ── Secrets scanning ─────────────────────────────────────────────────────────
# VAPID_PUBLIC_KEY is intentionally embedded in client-side JS (it is a public key).
# Tell Netlify not to block deploys because of it.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VAPID_PUBLIC_KEY"

[[edge_functions]]
  function = "block-source-files"
  # Regex, not a glob. Blocks .sql/.md/.sh/etc at any depth — the extension
  # cases that redirect splats cannot express. See the function file for why.
  pattern = "^/.*\\.(sql|md|sh|yml|yaml|toml|lock|bak|backup|env)$"

[functions]
  node_bundler = "esbuild"

# ── Scheduled functions ──────────────────────────────────────────────────────
# ⚠️  ALL scheduled functions below require the Netlify Pro / Team plan.
#    On the free plan every schedule entry is silently ignored — no error, no run.
#    Alternative: use Supabase Edge Functions + pg_cron (free tier supports it).
#    renewal-reminder already has a Supabase Edge Function in
#    supabase/functions/renewal-reminder/ — see its index.ts for the pg_cron SQL.
# To test any function manually: POST /.netlify/functions/<name> (body may be empty)

# Schedules REMOVED. These three functions now require ADMIN_SECRET or CRON_SECRET
# unconditionally, and Netlify's scheduler cannot present either — so leaving the
# schedules here would produce a silent daily 401 that looks like the emails simply
# stopped working.
#
# They previously accepted an `x-nf-event-trigger` header as proof of being the
# scheduler. That header arrives on the inbound request, so any caller could send
# it and skip the secret entirely — mass mail from support@soulgainz.app on demand,
# and live Stripe promotion codes from birthday-emails. It was never a gate.
#
# Supabase pg_cron is the invoker: it sends CRON_SECRET as a Bearer token. See
# supabase/cron-jobs.sql. That path also works on the free plan, which these
# schedules never did.

# Custom redirects (PWA-friendly)

# ── Security: block admin panel and dev artefacts from public access ───────
#
# force = true is LOAD-BEARING. Netlify applies a redirect only when no static
# file matches the path; without force, a rule pointing at an existing file does
# NOTHING. Every rule in this block was previously unforced, so admin.html and
# ~900 KB of stale app copies (baseline-v15.html, recipe-review.html) were
# publicly served despite the rules that were supposed to block them. The
# /pricing rules further down always had force = true, which is why those work.
#
# The marketing site is a separate Netlify site built from marketing-site/.
# From THIS site, that directory must be unreachable: it carries prices and a
# checkout, on the app domain, inside PWA scope — the App Store rule, breached.
# Blocked in .netlifyignore as well; this rule is the one that is certain to
# hold on a git-triggered build.
[[redirects]]
  from = "/marketing-site/*"
  to = "/404.html"
  status = 404
  force = true

# admin.html's own gate is a client-side sessionStorage boolean, so serving it
# at all is the problem — the admin FUNCTIONS verify ADMIN_SECRET server-side,
# but the panel should not be reachable.
[[redirects]]
  from = "/admin.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/baseline-v15.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/recipe-review.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/recipe-release.html"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/generate-icons.html"
  to = "/404.html"
  status = 404
  force = true

# ── Security: block source, docs and tooling from public access ────────────
#
# .netlifyignore DOES NOT WORK for this. It was added on 2026-08-31 to exclude
# supabase/, *.md, *.sql and package.json, and none of it took effect: as of
# 2026-09-05 /supabase/cron-jobs.sql, /AUDIT_REPORT.md and /package.json all
# still returned 200. Netlify does not apply .netlifyignore to the publish
# directory of a `publish = "."` site — forced redirects are the mechanism that
# actually works here, same as the admin.html block above.
#
# Directory splats. The trailing /* is required; Netlify matches the splat only
# at the END of a path, which is also why there is no `/*.sql` rule — that
# pattern silently matches nothing. Extensions are handled by the edge function
# declared further down instead.
[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/recipe-intake/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/screenshots/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/uat_screenshots/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/files/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/social/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/socials/*"
  to = "/404.html"
  status = 404
  force = true

# Dependency manifests. Named explicitly rather than by extension: a blanket
# *.json block would take out manifest.json and break the PWA install.
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true

# Root → landing page (SEO: bare domain shows marketing page, not app shell)
[[redirects]]
  from = "/"
  to = "/landing.html"
  status = 301

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

[[redirects]]
  from = "/waitlist"
  to = "/waitlist.html"
  status = 200

# Pricing lives ONLY on the marketing site.
#
# soulgainz.app/pricing used to serve its own pricing.html: full €16.99/€150
# price cards and a working Stripe checkout, on the app's own domain and inside
# the PWA's scope. That is precisely what moving payments to
# marketing.soulgainz.app was meant to prevent, and because it was a second copy
# of the same page the two drifted apart in wording, recipe counts and feature
# lists.
#
# 301 (not 200) so it is a real redirect: the browser leaves soulgainz.app, the
# URL changes, search engines consolidate onto one canonical pricing page, and
# no price or buy button is ever served from the app domain. Existing links and
# bookmarks keep working.
[[redirects]]
  from = "/pricing"
  to = "https://marketing.soulgainz.app/pricing"
  status = 301
  force = true

# Same for anyone hitting the old file path directly.
[[redirects]]
  from = "/pricing.html"
  to = "https://marketing.soulgainz.app/pricing"
  status = 301
  force = true

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 200

[[redirects]]
  from = "/blog"
  to = "/blog.html"
  status = 200

[[redirects]]
  from = "/success"
  to = "/success.html"
  status = 200

[[redirects]]
  from = "/404"
  to = "/404.html"
  status = 404

# ── Block internal/dev pages from public access ──────────────────────────────
# index.html.bak was previously served at /index.html.bak — a full stale copy of
# the app, including obsolete Stripe price IDs. Deleted from the repo; this rule
# is belt-and-braces in case another backup ever lands in the publish root.
[[redirects]]
  from = "/*.bak"
  to = "/404"
  status = 404

[[redirects]]
  from = "/uat_screenshots/*"
  to = "/404"
  status = 404

[[redirects]]
  from = "/baseline-v15.html"
  to = "/404"
  status = 404

[[redirects]]
  from = "/recipe-release.html"
  to = "/404"
  status = 404

[[redirects]]
  from = "/recipe-review.html"
  to = "/404"
  status = 404

[[redirects]]
  from = "/recipe-image-prompts.html"
  to = "/404"
  status = 404

[[redirects]]
  from = "/generate-icons.html"
  to = "/404"
  status = 404

[[redirects]]
  from = "/generate-icons 2.html"
  to = "/404"
  status = 404

[[redirects]]
  from = "/blog-meal-prep-beginners 2.html"
  to = "/404"
  status = 404

# recipes-preview.html is a live SEO page — intentionally NOT blocked
# ── Security headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking — only allow in same-origin iframes
    X-Frame-Options = "SAMEORIGIN"
    # Stop browsers from MIME-sniffing scripts/styles
    X-Content-Type-Options = "nosniff"
    # Limit referrer info sent to third parties
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Force HTTPS for 1 year (including subdomains). Remove includeSubDomains if it causes issues.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Restrict browser feature access — no mic/camera/geo unless the app explicitly requests
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self), usb=()"
    # Basic XSS protection for older browsers
    X-XSS-Protection = "1; mode=block"
    # Content Security Policy — enforced here (HTTP header) so it applies to ALL pages
    # before any resource is parsed, unlike a <meta> tag which is parsed mid-document.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://js.sentry-cdn.com https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com data:; img-src 'self' data: blob: https://www.google-analytics.com; connect-src 'self' https://checkout.stripe.com https://soulgainz.app/.netlify/functions/ https://soulgainz.netlify.app/.netlify/functions/ https://rjreunvnsfjclpighogp.supabase.co https://*.supabase.co https://fonts.googleapis.com https://*.sentry.io https://o*.ingest.sentry.io https://www.google-analytics.com https://analytics.google.com https://region1.google-analytics.com; worker-src 'self'; base-uri 'none'; form-action 'self'; object-src 'none'; frame-ancestors 'none'"

# ── Netlify function CORS pre-flight ─────────────────────────────────────────
# NOTE: no Access-Control-Allow-Origin here on purpose.
# A site-wide "*" previously overrode every function's own per-request CORS
# policy, letting any website read responses from check-user (an account
# existence oracle) and restore-account (name, email, subscription tier).
# Each function sets its own origin header — leave this to them.
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Methods = "POST, GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type, Authorization"
    Access-Control-Max-Age = "86400"
