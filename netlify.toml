# Netlify configuration for Meal Prep app

[build]
  publish = "."
  functions = "netlify/functions"

# ── Secrets scanning ─────────────────────────────────────────────────────────
# VAPID_PUBLIC_KEY is intentionally embedded in client-side JS (it is a public key).
# Tell Netlify not to block deploys because of it.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "VAPID_PUBLIC_KEY"

[functions]
  node_bundler = "esbuild"

# ── Scheduled functions ──────────────────────────────────────────────────────
# Requires Netlify Pro / Team plan. These run automatically via cron.
# To test manually: POST /.netlify/functions/<name> (event.body will be empty)

[functions."birthday-emails"]
  schedule = "0 8 * * *"      # Daily at 08:00 UTC — check + send birthday emails

[functions."holiday-emails"]
  schedule = "0 7 * * *"      # Daily at 07:00 UTC — check + send holiday emails

# Custom redirects (PWA-friendly)
[[redirects]]
  from = "/portal"
  to = "/.netlify/functions/customer-portal"
  status = 200

[[redirects]]
  from = "/terms"
  to = "/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to = "/privacy.html"
  status = 200

# ── Security headers ──────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    # Prevent clickjacking — only allow in same-origin iframes
    X-Frame-Options = "SAMEORIGIN"
    # Stop browsers from MIME-sniffing scripts/styles
    X-Content-Type-Options = "nosniff"
    # Limit referrer info sent to third parties
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Force HTTPS for 1 year (including subdomains). Remove includeSubDomains if it causes issues.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Restrict browser feature access — no mic/camera/geo unless the app explicitly requests
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(self), usb=()"
    # Basic XSS protection for older browsers
    X-XSS-Protection = "1; mode=block"

# ── Netlify function CORS pre-flight ─────────────────────────────────────────
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Access-Control-Allow-Origin = "https://soulgainz.app"
    Access-Control-Allow-Methods = "POST, GET, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"
    Access-Control-Max-Age = "86400"
