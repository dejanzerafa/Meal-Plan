let filtered = [...RECIPES];
let current = 0;
let activeTab = 'ingredients';
let activeFilter = 'all';

// Persistent state
let flagged = JSON.parse(localStorage.getItem('sg_flagged') || '{}');
let fixNotes = JSON.parse(localStorage.getItem('sg_fixnotes') || '{}');

function save() {
  localStorage.setItem('sg_flagged', JSON.stringify(flagged));
  localStorage.setItem('sg_fixnotes', JSON.stringify(fixNotes));
}

const CAT_ICONS = { Protein:'🥩', Carbs:'🍚', Vegetables:'🥦', Dairy:'🧀', Fats:'🫒', Liquids:'💧', Aromatics:'🧄', Sauces:'🍶', Fruits:'🍌', Spices:'🌶️', Other:'📦' };
const CAT_ORDER = ['Protein','Carbs','Vegetables','Dairy','Fruits','Fats','Liquids','Aromatics','Sauces','Spices','Other'];
const CAT_LABELS = { main:'🍗 Main', breakfast:'🌅 Breakfast', dessert:'🍫 Dessert', preworkout:'⚡ Pre-Workout' };

function fmtQty(qty, unit) {
  const q = parseFloat(qty);
  if (unit === 'whole') return q % 1 === 0 ? q.toFixed(0) : q.toFixed(1);
  if (q >= 1000 && unit === 'g') return (q/1000).toFixed(q%1000===0?0:1) + ' kg';
  if (q >= 1000 && unit === 'mL') return (q/1000).toFixed(q%1000===0?0:1) + ' L';
  return q % 1 === 0 ? q.toFixed(0) : q.toFixed(1);
}

function toggleFlag() {
  const r = filtered[current];
  if (!r) return;
  if (flagged[r.id]) delete flagged[r.id];
  else flagged[r.id] = r.name;
  save();
  render();
}

function saveFixNote() {
  const r = filtered[current];
  if (!r) return;
  const val = document.getElementById('fix-textarea')?.value.trim();
  if (val) fixNotes[r.id] = { name: r.name, cat: r.category, note: val };
  else delete fixNotes[r.id];
  save();
  const msg = document.getElementById('fix-saved-msg');
  if (msg) { msg.classList.add('show'); setTimeout(() => msg.classList.remove('show'), 1800); }
  updateHeaderBadges();
}

function clearFixNote() {
  const r = filtered[current];
  if (!r) return;
  delete fixNotes[r.id];
  save();
  const ta = document.getElementById('fix-textarea');
  if (ta) ta.value = '';
  updateHeaderBadges();
  render();
}

function filterCat(cat, el) {
  activeFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  if (el) el.classList.add('active');
  if (cat === 'all') filtered = [...RECIPES];
  else if (cat === 'flagged') filtered = RECIPES.filter(r => flagged[r.id]);
  else if (cat === 'needs-fix') filtered = RECIPES.filter(r => fixNotes[r.id]);
  else filtered = RECIPES.filter(r => r.category === cat);
  current = 0;
  activeTab = 'ingredients';
  render();
  window.scrollTo(0,0);
}

function navigate(dir) {
  // Auto-save fix note if textarea has content
  autoSaveFix();
  current = Math.max(0, Math.min(filtered.length - 1, current + dir));
  activeTab = 'ingredients';
  render();
  window.scrollTo(0,0);
}

function jumpTo(n) {
  const idx = parseInt(n) - 1;
  if (!isNaN(idx) && idx >= 0 && idx < filtered.length) {
    autoSaveFix();
    current = idx;
    render();
    window.scrollTo(0,0);
  }
  document.getElementById('jump-input').value = '';
}

function jumpToId(id) {
  autoSaveFix();
  filtered = [...RECIPES];
  activeFilter = 'all';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.filter-btn').classList.add('active');
  const idx = filtered.findIndex(r => r.id === id);
  if (idx !== -1) { current = idx; render(); window.scrollTo(0,0); }
}

function autoSaveFix() {
  const ta = document.getElementById('fix-textarea');
  const r = filtered[current];
  if (!ta || !r) return;
  const val = ta.value.trim();
  if (val) { fixNotes[r.id] = { name: r.name, cat: r.category, note: val }; save(); }
}

function setTab(tab) {
  autoSaveFix();
  activeTab = tab;
  renderTabContent();
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-tab="${tab}"]`)?.classList.add('active');
}

function updateHeaderBadges() {
  const fc = Object.keys(flagged).length;
  const nc = Object.keys(fixNotes).length;
  const el = document.getElementById('hdr-badges');
  if (!el) return;
  let html = '';
  if (fc) html += `<span class="hbadge hbadge-flag">🚩 ${fc}</span>`;
  if (nc) html += `<span class="hbadge hbadge-fix">🔧 ${nc}</span>`;
  el.innerHTML = html;
}

function renderTabContent() {
  const r = filtered[current];
  const area = document.getElementById('tab-area');
  if (!area || !r) return;

  if (activeTab === 'ingredients') {
    const cats = {};
    (r.ingredients || []).forEach(i => { if (!cats[i.cat]) cats[i.cat] = []; cats[i.cat].push(i); });
    let html = `<div class="section-lbl">FULL BATCH — ${r.portions !== '?' ? r.portions + ' PORTIONS' : '1 SERVING'}</div>`;
    CAT_ORDER.forEach(cat => {
      const items = cats[cat];
      if (!items?.length) return;
      html += `<div class="cat-group">
        <div class="cat-lbl">${CAT_ICONS[cat]||'•'} ${cat.toUpperCase()}</div>`;
      items.forEach(i => {
        const qStr = fmtQty(i.qty, i.unit);
        const uStr = i.unit === 'whole' ? '' : i.unit;
        html += `<div class="ing-row">
          <span class="ing-qty">${qStr}</span><span class="ing-unit">${uStr}</span>
          <span class="ing-label">${i.label}</span>
        </div>`;
      });
      html += `</div>`;
    });
    area.innerHTML = html;

  } else if (activeTab === 'method') {
    if (!r.steps?.length) {
      area.innerHTML = '<div class="no-content">No method steps recorded.</div>';
      return;
    }
    let html = '';
    r.steps.forEach((step, i) => {
      html += `<div class="step-row">
        <div class="step-num">${i+1}</div>
        <div class="step-text">${step}</div>
      </div>`;
    });
    area.innerHTML = html;

  } else if (activeTab === 'notes') {
    area.innerHTML = r.note
      ? `<div class="note-box">${r.note}</div>`
      : `<div class="no-content">No recipe notes.</div>`;

  } else if (activeTab === 'fix') {
    const existing = fixNotes[r.id]?.note || '';
    area.innerHTML = `<div class="fix-tab-wrap">
      <div class="fix-label">📋 What needs fixing in this recipe?</div>
      <textarea id="fix-textarea" class="fix-textarea" placeholder="e.g. Step 3 says '4 eggs' but ingredients list shows 6 eggs. Also portion count seems wrong for the quantities listed...">${existing}</textarea>
      <div class="fix-actions">
        <button class="fix-save-btn" onclick="saveFixNote()">💾 Save Note</button>
        <button class="fix-clear-btn" onclick="clearFixNote()">✕ Clear</button>
        <span class="fix-saved-msg" id="fix-saved-msg">✓ Saved</span>
      </div>
      <div style="margin-top:14px;padding-top:12px;border-top:1px solid #1e1e1e">
        <div style="font-size:10px;color:#333;margin-bottom:6px;font-weight:700;letter-spacing:0.08em">ALL FIX NOTES (${Object.keys(fixNotes).length})</div>
        ${Object.keys(fixNotes).length === 0
          ? '<div style="font-size:12px;color:#2a2a2a;font-style:italic">None yet — notes you save here will appear in this list.</div>'
          : Object.entries(fixNotes).map(([id,v]) => `
            <div class="summary-item fix" onclick="jumpToId('${id}')">
              <div style="flex:1">
                <div class="si-name fix">${v.name}</div>
                <div class="si-note">${v.note.substring(0,120)}${v.note.length>120?'…':''}</div>
              </div>
              <div class="si-cat">${CAT_LABELS[v.cat]||v.cat}</div>
            </div>`).join('')
        }
      </div>
    </div>`;
  }
}

function render() {
  const wrap = document.getElementById('card-wrap');
  const summary = document.getElementById('summary-panel');
  const r = filtered[current];
  const total = filtered.length;

  updateHeaderBadges();

  // Update progress
  document.getElementById('hdr-label').textContent = `Recipe ${current+1} of ${total}`;
  document.getElementById('hdr-fill').style.width = total ? ((current+1)/total*100)+'%' : '0%';
  document.getElementById('nc-num').textContent = `${current+1} / ${total}`;
  document.getElementById('btn-prev').disabled = current === 0;
  document.getElementById('btn-next').disabled = current === total - 1 || total === 0;

  if (!r) {
    wrap.innerHTML = `<div style="text-align:center;padding:60px 20px;color:#333;font-size:14px">
      ${activeFilter==='flagged' ? 'No flagged recipes yet. Hit 🚩 on any recipe.' :
        activeFilter==='needs-fix' ? 'No fix notes yet. Use the 🔧 Fix tab on any recipe.' :
        'No recipes found.'}
    </div>`;
    document.getElementById('btn-flag').style.display = 'none';
    summary.style.display = 'none';
    return;
  }

  document.getElementById('btn-flag').style.display = '';
  const isFlagged = !!flagged[r.id];
  const hasFix = !!fixNotes[r.id];
  document.getElementById('btn-flag').className = 'btn-flag' + (isFlagged ? ' flagged' : '');
  const pp = r.perPortion || {};

  // Summary panel for flagged/fix views
  if (activeFilter === 'flagged' || activeFilter === 'needs-fix') {
    summary.style.display = 'block';
    const items = activeFilter === 'flagged'
      ? Object.entries(flagged).map(([id,name]) => ({ id, name, cat: RECIPES.find(x=>x.id===id)?.cat||'' }))
      : Object.entries(fixNotes).map(([id,v]) => ({ id, name:v.name, cat:v.cat, note:v.note }));
    const type = activeFilter === 'flagged' ? 'flag' : 'fix';
    const icon = type === 'flag' ? '🚩' : '🔧';
    summary.innerHTML = `<div class="summary-section">
      <div class="summary-title ${type}">${icon} ${items.length} recipe${items.length!==1?'s':''} ${type==='flag'?'flagged':'with fix notes'}</div>
      ${items.map(it => `<div class="summary-item ${type}" onclick="jumpToId('${it.id}')">
        <div style="flex:1">
          <div class="si-name ${type}">${it.name}</div>
          ${it.note ? `<div class="si-note">${it.note.substring(0,100)}${it.note.length>100?'…':''}</div>` : ''}
        </div>
        <div class="si-cat">${CAT_LABELS[it.cat]||it.cat}</div>
      </div>`).join('')}
    </div>`;
  } else {
    summary.style.display = 'none';
  }

  const cardClasses = ['recipe-card', isFlagged&&'flagged', hasFix&&'has-fix'].filter(Boolean).join(' ');

  wrap.innerHTML = `<div class="${cardClasses}">
    <div class="card-header">
      <div class="badges-row">
        <span class="badge b-cat">${CAT_LABELS[r.category]||r.category}</span>
        ${r.badge ? `<span class="badge b-badge">${r.badge}</span>` : ''}
        ${isFlagged ? `<span class="badge b-flag">🚩 Flagged</span>` : ''}
        ${hasFix ? `<span class="badge b-fix">🔧 Has Fix Note</span>` : ''}
      </div>
      <div class="recipe-name">${r.name}</div>
      <div class="recipe-sub">${r.subtitle||''}</div>
      <div class="macros-row">
        ${pp.kcal ? `<div class="macro-chip mk"><b>${pp.kcal}</b> kcal</div>` : ''}
        ${pp.protein ? `<div class="macro-chip mp"><b>${pp.protein}g</b> P</div>` : ''}
        ${pp.carbs ? `<div class="macro-chip mc"><b>${pp.carbs}g</b> C</div>` : ''}
        ${pp.fat ? `<div class="macro-chip mf"><b>${pp.fat}g</b> F</div>` : ''}
        <div class="portions-chip">× ${r.portions!=='?'?r.portions+' portions':'1 serving'}</div>
      </div>
    </div>
    <div class="tabs">
      <button class="tab ${activeTab==='ingredients'?'active':''}" data-tab="ingredients" onclick="setTab('ingredients')">🍱 Ingredients</button>
      <button class="tab ${activeTab==='method'?'active':''}" data-tab="method" onclick="setTab('method')">👨‍🍳 Method</button>
      <button class="tab ${activeTab==='notes'?'active':''}" data-tab="notes" onclick="setTab('notes')">📝 Notes</button>
      <button class="tab tab-fix ${activeTab==='fix'?'active':''} ${hasFix?'has-note':''}" data-tab="fix" onclick="setTab('fix')">🔧 Fix${hasFix?' ●':''}</button>
    </div>
    <div class="tab-content" id="tab-area"></div>
  </div>`;

  renderTabContent();
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') navigate(1);
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') navigate(-1);
  if (e.key === 'f' || e.key === 'F') toggleFlag();
  if (e.key === 'n' || e.key === 'N') setTab('fix');
});

render();
</script>
