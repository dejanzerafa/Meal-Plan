// ─── HELPERS ───────────────────────────────────────────────────────────────
function fmtQty(qty, unit) {
  if (unit === "g")   return qty >= 1000 ? `${+(qty/1000).toFixed(1)} kg`  : `${Math.round(qty)} g`;
  if (unit === "mL")  return qty >= 1000 ? `${+(qty/1000).toFixed(1)} L`   : `${Math.round(qty)} mL`;
  return String(Math.round(qty));
}
function fmtItem(item) {
  const q   = fmtQty(item.qty, item.unit);
  const lbl = item.unit === "whole" && item.qty > 1 && !item.label.endsWith("s")
    ? item.label + "s" : item.label;
  return `${q} ${lbl}`;
}
function mergeItems(lr, dr) {
  const map = {};
  const add = (arr) => arr.forEach(i => {
    if (map[i.key]) map[i.key] = { ...map[i.key], qty: map[i.key].qty + i.qty };
    else map[i.key] = { ...i };
  });
  if (lr.id === dr.id) add(lr.batchItems.map(i => ({ ...i, qty: i.qty * 2 })));
  else { add(lr.batchItems); add(dr.batchItems); }
  const grouped = {};
  CAT_ORDER.forEach(c => { grouped[c] = []; });
  Object.values(map).forEach(i => { (grouped[i.cat] = grouped[i.cat] || []).push(i); });
  return Object.fromEntries(Object.entries(grouped).filter(([,v]) => v.length > 0));
}
function computeMeals(lr, dr) {
  const L = { ...lr.perPortion };
  const D = { kcal: dr.perPortion.kcal + FISH_OIL.kcal, protein: dr.perPortion.protein,
               carbs: dr.perPortion.carbs, fat: +(dr.perPortion.fat + FISH_OIL.fat).toFixed(1) };
  const total = {
    kcal:    BREAKFAST.kcal    + PRE.kcal    + L.kcal    + D.kcal,
    protein: BREAKFAST.protein + PRE.protein + L.protein + D.protein,
    carbs:   BREAKFAST.carbs   + PRE.carbs   + L.carbs   + D.carbs,
    fat:     +(BREAKFAST.fat   + PRE.fat     + L.fat     + D.fat).toFixed(1),
  };
  return { L, D, total };
}
function pct(v,t){ return Math.min(100,Math.round(v/t*100)); }

function Bar({ v, t, color }) {

    </div>
  );
}

// ─── DAILY TOTAL BAR ───────────────────────────────────────────────────────
// Kcal: ≤2500 green · 2501–2700 amber · >2700 red
// Protein: below 90% amber · 90–115% green · above 115% amber (never red)
// Carbs: below 90% amber · 90–105% green · above 105% red
// Fat: at/below target green · any over red
function kcalStatus(v) {
  if (v > 2700) return { c:"#ef4444", tag:"⚠ over limit" };
  if (v > 2500) return { c:"#f59e0b", tag:"↑ above target" };
  return { c:"#22c55e", tag:"✓ within target" };
}
function macroStatus(v, t, kind) {
  const r = v / t;
  if (kind === "protein") {
    if (r < 0.90) return { c:"#f59e0b", tag:"↓ below" };
    if (r > 1.15) return { c:"#f59e0b", tag:"↑ above" };
    return { c:"#22c55e", tag:"✓" };
  }
  if (kind === "carbs") {
    if (r < 0.90) return { c:"#f59e0b", tag:"↓ below" };
    if (r > 1.05) return { c:"#ef4444", tag:"↑ over" };
    return { c:"#22c55e", tag:"✓" };
  }
  if (kind === "fat") {
    if (v > t) return { c:"#ef4444", tag:"↑ over" };
    return { c:"#22c55e", tag:"✓" };
  }
  return { c:"#22c55e", tag:"✓" };
}
function TotalBar({ total }) {
  const ks = kcalStatus(total.kcal);
  const rows = [
    { label:"Protein", v:total.protein, t:TARGETS.protein, kind:"protein" },
    { label:"Carbs",   v:total.carbs,   t:TARGETS.carbs,   kind:"carbs"   },
    { label:"Fat",     v:total.fat,     t:TARGETS.fat,     kind:"fat"     },
  ];
  return (
    <div style={{ background:C.card, border:`1.5px solid ${C.dim}`, borderRadius:14, padding:"14px 16px", marginBottom:10 }}>
      {/* Kcal header */}
      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:5 }}>
        <div style={{ display:"flex", alignItems:"center", gap:8 }}>
          <span style={{ fontSize:11, fontWeight:700, color:C.sub, letterSpacing:"0.07em" }}>DAILY TOTAL</span>
          <span style={{ fontSize:10, color:ks.c, fontWeight:700,
            background:`${ks.c}20`, borderRadius:4, padding:"2px 6px" }}>{ks.tag}</span>
        </div>
        <span style={{ fontSize:18, fontWeight:800, color:ks.c }}>
          {total.kcal}
          <span style={{ fontSize:11, fontWeight:400, color:C.sub }}> / 2500 kcal</span>
        </span>
      </div>
      {/* Kcal bar */}
      <div style={{ height:5, background:C.dim, borderRadius:3, overflow:"hidden", marginBottom:14 }}>
        <div style={{ height:"100%", width:`${Math.min(pct(total.kcal,2500),100)}%`,
          background:ks.c, borderRadius:3, transition:"width 0.4s" }} />
      </div>
      {/* Macro rows */}
      {rows.map(({ label, v, t, kind }) => {
        const ms = macroStatus(v, t, kind);
        return (
          <div key={label} style={{ marginBottom:10 }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:4 }}>
              <div style={{ display:"flex", alignItems:"center", gap:6 }}>
                <span style={{ fontSize:11, fontWeight:600, color:C.sub }}>{label}</span>
                <span style={{ fontSize:10, color:ms.c, fontWeight:700,
                  background:`${ms.c}18`, borderRadius:4, padding:"1px 5px" }}>{ms.tag}</span>
              </div>
              <span style={{ fontSize:12, fontWeight:700, color:ms.c }}>
                {v}g <span style={{ fontSize:10, fontWeight:400, color:C.muted }}>/ {t}g</span>
              </span>
            </div>
            <div style={{ height:5, background:C.dim, borderRadius:3, overflow:"hidden" }}>
              <div style={{ height:"100%", width:`${Math.min(pct(v,t),100)}%`,
                background:ms.c, borderRadius:3, transition:"width 0.4s" }} />
            </div>
          </div>
        );
      })}
    </div>
  );
}

              color: isL ? "#000" : C.sub, letterSpacing:"0.03em" }}>
            {isL ? "☀️ Lunch ✓" : "☀️ Set Lunch"}
          </button>
          <button onClick={()=>setDinner(r.id)}
            style={{ flex:1, padding:"7px 0", fontSize:12, fontWeight:600, borderRadius:8, border:"none",
              cursor:"pointer", background: isD ? "#7c3aed" : C.card2,
              color: isD ? "#fff" : C.sub, letterSpacing:"0.03em" }}>
            {isD ? "🌙 Dinner ✓" : "🌙 Set Dinner"}
          </button>
          <button onClick={()=>setOpen(o=>!o)}
            style={{ padding:"7px 10px", fontSize:12, borderRadius:8, border:`1px solid ${C.dim}`,
              cursor:"pointer", background:"none", color:C.sub }}>
            {open ? "▲" : "▼"}
          </button>
        </div>
      </div>
      {open && (
        <div style={{ borderTop:`1px solid ${C.dim}`, padding:"12px 14px" }}>
          {r.note && <div style={{ fontSize:11, color:C.sub, background:C.card2, borderRadius:6,
            padding:"6px 10px", marginBottom:10, lineHeight:1.5 }}>💡 {r.note}</div>}

          {/* Toggle bar */}
          <div style={{ display:"flex", gap:6, marginBottom:12 }}>
            {[["ingredients","🧺 Ingredients"],["method","👨‍🍳 Method"]].map(([v,lbl])=>(
              <button key={v} onClick={()=>setView(v)}
                style={{ flex:1, padding:"6px 0", fontSize:11, fontWeight:700, borderRadius:7, border:"none",
                  cursor:"pointer", letterSpacing:"0.04em",
                  background: view===v ? C.accent : C.card2,
                  color:       view===v ? "#000"   : C.sub }}>
                {lbl}
              </button>
            ))}
          </div>

          {/* INGREDIENTS view */}
          {view === "ingredients" && (
            <div>
              <div style={{ fontSize:10, fontWeight:700, color:C.sub, letterSpacing:"0.08em", marginBottom:8 }}>
                BATCH — 7 PORTIONS
              </div>
              {CAT_ORDER.map(cat => {
                const catItems = r.batchItems.filter(i => i.cat === cat);
                if (!catItems.length) return null;
                return (
                  <div key={cat} style={{ marginBottom:10 }}>
                    <div style={{ fontSize:10, fontWeight:700, color:C.sub, letterSpacing:"0.07em", marginBottom:5 }}>
                      {CAT_ICON[cat]} {cat.toUpperCase()}
                    </div>
                    {catItems.map(item => (
                      <div key={item.key} style={{ display:"flex", alignItems:"center", gap:8,
                        padding:"5px 8px", background:C.card2, borderRadius:6, marginBottom:3 }}>
                        <span style={{ fontSize:12, color:C.accent, fontWeight:700 }}>·</span>
                        <span style={{ fontSize:12, color:C.text }}>{fmtItem(item)}</span>
                      </div>
                    ))}
                  </div>
                );
              })}
            </div>
          )}

          {/* METHOD view */}
          {view === "method" && (
            <div>
              <div style={{ fontSize:10, fontWeight:700, color:C.sub, letterSpacing:"0.08em", marginBottom:8 }}>
                COOKING STEPS — 7 PORTIONS
              </div>
              {r.steps.map((s,i)=>(
                <div key={i} style={{ display:"flex", gap:8, marginBottom:8 }}>
                  <span style={{ color:C.accent, fontWeight:700, fontSize:12, minWidth:18,
                    background:C.accentDim, borderRadius:4, padding:"1px 5px", flexShrink:0,
                    textAlign:"center", alignSelf:"flex-start" }}>{i+1}</span>
                  <span style={{ fontSize:12, color:C.text, lineHeight:1.6 }}>{s}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

// ─── SHOPPING LIST ──────────────────────────────────────────────────────────
function ShoppingList({ lr, dr }) {
  const [checked, setChecked] = useState({});
  const toggle = k => setChecked(c => ({ ...c, [k]: !c[k] }));
  const batch = mergeItems(lr, dr);
  const sameRecipe = lr.id === dr.id;

  return (
    <div>
      {/* Batch header */}
      <div style={{ background:C.accentDim, border:`1px solid ${C.accentBorder}`,
        borderRadius:12, padding:"10px 14px", marginBottom:12 }}>
        <div style={{ fontSize:11, fontWeight:700, color:C.accent, letterSpacing:"0.07em", marginBottom:2 }}>
          BATCH INGREDIENTS — 7 DAYS
        </div>
        <div style={{ fontSize:12, color:C.text }}>
          ☀️ {lr.name} {sameRecipe ? "× 2 slots (×2 qty)" : `+ 🌙 ${dr.name}`}
        </div>
        {sameRecipe && <div style={{ fontSize:10, color:C.sub, marginTop:2 }}>
          Same recipe for both meals — all quantities doubled.
        </div>}
      </div>

      {/* Merged batch items */}
      {Object.entries(batch).map(([cat, items]) => (
        <div key={cat} style={{ marginBottom:14 }}>
          <div style={{ fontSize:10, fontWeight:700, color:C.sub, letterSpacing:"0.08em", marginBottom:6 }}>
            {CAT_ICON[cat]} {cat.toUpperCase()}
          </div>
          {items.map(item => {
            const k = `b_${item.key}`;
            return (
              <div key={item.key} onClick={()=>toggle(k)}
                style={{ display:"flex", alignItems:"center", gap:10, padding:"7px 10px",
                  background: checked[k] ? C.card2 : C.card, borderRadius:8, marginBottom:4,
                  cursor:"pointer", opacity: checked[k] ? 0.5 : 1,
                  border:`1px solid ${checked[k]?C.muted:C.dim}` }}>
                <div style={{ width:16, height:16, borderRadius:4, flexShrink:0,
                  border:`2px solid ${checked[k]?C.green:C.muted}`,
                  background: checked[k] ? C.green : "none",
                  display:"flex", alignItems:"center", justifyContent:"center" }}>
                  {checked[k] && <span style={{fontSize:10,color:"#000"}}>✓</span>}
                </div>
                <span style={{ fontSize:12, color: checked[k]?C.muted:C.text, textDecoration: checked[k]?"line-through":"none" }}>
                  {fmtItem(item)}
                </span>
              </div>
            );
          })}
        </div>
      ))}

      {/* Fixed sections */}
      {Object.entries(FIXED).map(([section, items]) => (
        <div key={section} style={{ marginBottom:14 }}>
          <div style={{ fontSize:10, fontWeight:700, color:C.sub, letterSpacing:"0.08em",
            marginBottom:6, marginTop:4 }}>{section.toUpperCase()}</div>
          {items.map((item,i) => {
            const k = `f_${section}_${i}`;
            return (
              <div key={k} onClick={()=>toggle(k)}
                style={{ display:"flex", alignItems:"center", gap:10, padding:"7px 10px",
                  background: checked[k] ? C.card2 : C.card, borderRadius:8, marginBottom:4,
                  cursor:"pointer", opacity: checked[k] ? 0.5 : 1,
                  border:`1px solid ${checked[k]?C.muted:C.dim}` }}>
                <div style={{ width:16, height:16, borderRadius:4, flexShrink:0,
                  border:`2px solid ${checked[k]?C.green:C.muted}`,
                  background: checked[k] ? C.green : "none",
                  display:"flex", alignItems:"center", justifyContent:"center" }}>
                  {checked[k] && <span style={{fontSize:10,color:"#000"}}>✓</span>}
                </div>
                <span style={{ fontSize:12, color: checked[k]?C.muted:C.text, textDecoration: checked[k]?"line-through":"none" }}>
                  {item}
                </span>
              </div>
            );
          })}
        </div>
      ))}
    </div>
  );
}

// ─── MACRO REF ─────────────────────────────────────────────────────────────
function MacroRef() {
  const [open, setOpen] = useState({});
  const tog = k => setOpen(o=>({...o,[k]:!o[k]}));
  return (
    <div>
      <div style={{ fontSize:11, color:C.sub, marginBottom:14, lineHeight:1.5 }}>
        Proteins, grains, dairy &amp; veg are per 100 g raw/dry. Oils and condiments are per serving. ½ tbsp olive oil added per meal portion. Fish oil (+18 kcal · +2g fat) added for dinner only.
      </div>
      {IDB.map(sec=>(
        <div key={sec.cat} style={{ marginBottom:10 }}>
          <div onClick={()=>tog(sec.cat)} style={{ display:"flex", justifyContent:"space-between",
            background:C.card, border:`1px solid ${C.dim}`, borderRadius:10, padding:"10px 14px",
            cursor:"pointer" }}>
            <span style={{ fontSize:13, fontWeight:600, color:C.text }}>{sec.cat}</span>
            <span style={{ color:C.sub }}>{open[sec.cat]?"▲":"▼"}</span>
          </div>
          {open[sec.cat] && (
            <div style={{ background:C.card2, border:`1px solid ${C.dim}`, borderTop:"none",
              borderRadius:"0 0 10px 10px", padding:"8px 14px" }}>
              <div style={{ display:"grid", gridTemplateColumns:"1fr auto auto auto auto",
                gap:"4px 10px", fontSize:10, color:C.sub, marginBottom:6, paddingBottom:4,
                borderBottom:`1px solid ${C.dim}` }}>
                <span>Item</span><span>kcal</span>
                <span style={{color:C.prot}}>P</span>
                <span style={{color:C.carb}}>C</span>
                <span style={{color:C.fat}}>F</span>
              </div>
              {sec.items.map(it=>(
                <div key={it.n} style={{ display:"grid", gridTemplateColumns:"1fr auto auto auto auto",
                  gap:"4px 10px", fontSize:11, padding:"4px 0", borderBottom:`1px solid ${C.dim}` }}>
                  <span style={{color:C.text}}>{it.n}</span>
                  <span style={{color:C.sub}}>{it.kcal}</span>
                  <span style={{color:C.prot}}>{it.p}</span>
                  <span style={{color:C.carb}}>{it.c}</span>
                  <span style={{color:C.fat}}>{it.f}</span>
                </div>
              ))}
            </div>
          )}
        </div>
      ))}
    </div>
  );
}

// ─── APP ───────────────────────────────────────────────────────────────────
const FILTERS = ["All", "🥘 Crockpot", "🍳 Stovetop", "🌬️ Oven"];
const FILTER_MAP = { "All":null, "🥘 Crockpot":"SC", "🍳 Stovetop":"ST", "🌬️ Oven":"AF" };

const TAB_META = [
  { id:"meals",    label:"Meals",    icon:"🍽️" },
  { id:"shopping", label:"Shop",     icon:"🛒" },
  { id:"recipes",  label:"Recipes",  icon:"📋" },
  { id:"macros",   label:"Macros",   icon:"📊" },
];

function App() {
  // ── Persistent selections via localStorage ──────────────────────────────
  const [lunch,  setLunchState]  = useState(() => localStorage.getItem("mp_lunch")  || "l1");
  const [dinner, setDinnerState] = useState(() => localStorage.getItem("mp_dinner") || "d1");
  const [tab,    setTab]         = useState("meals");
  const [filter, setFilter]      = useState("All");

  const setLunch = id => { setLunchState(id);  localStorage.setItem("mp_lunch",  id); };
  const setDinner= id => { setDinnerState(id); localStorage.setItem("mp_dinner", id); };

  const lr = RECIPES.find(r => r.id === lunch)  || RECIPES[0];
  const dr = RECIPES.find(r => r.id === dinner) || RECIPES[3];
  const { L, D, total } = computeMeals(lr, dr);

  const filteredRecipes = RECIPES.filter(r => {
    const f = FILTER_MAP[filter];
    return f ? r.badge.includes(f) : true;
  });

  const handleSetLunch  = id => { setLunch(id);  setTab("meals"); };
  const handleSetDinner = id => { setDinner(id); setTab("meals"); };

  // ── Sidebar width ────────────────────────────────────────────────────────
  const SW = 72;

  return (
    <div style={{ display:"flex", height:"100vh", maxWidth:520, margin:"0 auto",
      fontFamily:"'SF Pro Display',-apple-system,BlinkMacSystemFont,sans-serif",
      color:C.text, background:C.bg, overflow:"hidden" }}>

      {/* ── Left Sidebar ─────────────────────────────────────────────────── */}
      <div style={{ width:SW, flexShrink:0, background:C.card,
        borderRight:`1px solid ${C.dim}`, display:"flex", flexDirection:"column",
        alignItems:"center", paddingTop:16, paddingBottom:24, zIndex:100 }}>

        {/* Logo mark */}
        <div style={{ width:36, height:36, borderRadius:10, background:C.accent,
          display:"flex", alignItems:"center", justifyContent:"center",
          fontSize:18, marginBottom:28, flexShrink:0 }}>🥗</div>

        {/* Tab buttons */}
        {TAB_META.map(t => {
          const active = tab === t.id;
          return (
            <button key={t.id} onClick={() => setTab(t.id)}
              style={{ width:52, paddingTop:10, paddingBottom:10, marginBottom:6,
                background: active ? C.accentDim : "none",
                border: active ? `1px solid ${C.accentBorder}` : "1px solid transparent",
                borderRadius:12, cursor:"pointer", display:"flex", flexDirection:"column",
                alignItems:"center", gap:4, transition:"all 0.15s" }}>
              <span style={{ fontSize:20, lineHeight:1 }}>{t.icon}</span>
              <span style={{ fontSize:9, fontWeight:700, letterSpacing:"0.05em",
                color: active ? C.accent : C.muted }}>
                {t.label.toUpperCase()}
              </span>
            </button>
          );
        })}

        {/* Spacer + selection indicator */}
        <div style={{ flex:1 }} />
        <div style={{ width:44, borderTop:`1px solid ${C.dim}`, paddingTop:12,
          display:"flex", flexDirection:"column", alignItems:"center", gap:6 }}>
          <div style={{ fontSize:9, color:C.muted, fontWeight:700, letterSpacing:"0.05em",
            textAlign:"center", lineHeight:1.4 }}>
            ☀️<br/><span style={{color:C.sub,fontSize:8}}>{lr.name.split(" ").slice(0,2).join(" ")}</span>
          </div>
          <div style={{ fontSize:9, color:C.muted, fontWeight:700, letterSpacing:"0.05em",
            textAlign:"center", lineHeight:1.4 }}>
            🌙<br/><span style={{color:C.sub,fontSize:8}}>{dr.name.split(" ").slice(0,2).join(" ")}</span>
          </div>
        </div>
      </div>

      {/* ── Main area ────────────────────────────────────────────────────── */}
      <div style={{ flex:1, display:"flex", flexDirection:"column", overflow:"hidden" }}>

        {/* Header */}
        <div style={{ padding:"16px 14px 10px", background:`linear-gradient(180deg,${C.card} 0%,transparent 100%)`,
          borderBottom:`1px solid ${C.dim}`, flexShrink:0 }}>
          <div style={{ fontSize:9, letterSpacing:"0.13em", color:C.sub, fontWeight:700 }}>DOHA · QATAR</div>
          <div style={{ fontSize:18, fontWeight:800, color:C.text, marginTop:1, lineHeight:1.2 }}>
            Meal Plan
            <span style={{ fontWeight:400, color:C.sub }}> — Dejan Zerafa</span>
          </div>
          <div style={{ fontSize:11, color:C.sub, marginTop:3 }}>
            ☀️ <span style={{color:C.text}}>{lr.name}</span>
            &nbsp;·&nbsp;
            🌙 <span style={{color:C.text}}>{dr.name}</span>
          </div>
        </div>

        {/* Scrollable content */}
        <div style={{ flex:1, overflowY:"auto", padding:"12px 12px 24px",
          WebkitOverflowScrolling:"touch" }}>

          {tab === "meals" && <>
            <TotalBar total={total} />
            <div style={{ fontSize:10, color:C.sub, textAlign:"center", margin:"6px 0 12px", lineHeight:1.6 }}>
              🌙 Dinner + fish oil (+18 kcal · +2g fat) &nbsp;·&nbsp; 🌙 Before bed: Magnesium glycinate
            </div>
            <MealCard meal={BREAKFAST} macros={BREAKFAST} />
            <MealCard meal={PRE}       macros={PRE}       />
            <MealCard meal={lr} macros={L} slot="lunch"  />
            <MealCard meal={dr} macros={D} slot="dinner" />
          </>}

          {tab === "shopping" && <ShoppingList lr={lr} dr={dr} />}

          {tab === "recipes" && <>
            <div style={{ display:"flex", gap:5, marginBottom:10, flexWrap:"wrap" }}>
              {FILTERS.map(f=>(
                <button key={f} onClick={()=>setFilter(f)}
                  style={{ flex:1, minWidth:60, padding:"6px 4px", fontSize:10, fontWeight:700,
                    borderRadius:8, border:"none", cursor:"pointer", letterSpacing:"0.03em",
                    background: filter===f ? C.accent : C.card2,
                    color:       filter===f ? "#000"   : C.sub }}>
                  {f}
                </button>
              ))}
            </div>
            <div style={{ fontSize:10, color:C.sub, marginBottom:10 }}>
              {filteredRecipes.length} recipe{filteredRecipes.length!==1?"s":""}
            </div>
            {filteredRecipes.map(r => (
              <RecipeCard key={r.id} r={r}
                activeLunch={lunch} activeDinner={dinner}
                setLunch={handleSetLunch} setDinner={handleSetDinner} />
            ))}
          </>}

          {tab === "macros" && <MacroRef />}

        </div>
      </div>
    </div>
  );
}

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
