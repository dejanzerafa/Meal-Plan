    // Generate home screen icon on canvas — red-orange gradient + flame + SoulGainz
    function buildIcon(size) {
      const c = document.createElement('canvas');
      c.width = size; c.height = size;
      const ctx = c.getContext('2d');
      const r = size * 0.22; // corner radius

      // ── Red-orange gradient background ────────────────────────────────────
      const grad = ctx.createLinearGradient(0, 0, size, size);
      grad.addColorStop(0, '#b83a14');
      grad.addColorStop(1, '#E07B2A');
      ctx.beginPath();
      ctx.moveTo(r, 0);
      ctx.lineTo(size - r, 0);
      ctx.quadraticCurveTo(size, 0, size, r);
      ctx.lineTo(size, size - r);
      ctx.quadraticCurveTo(size, size, size - r, size);
      ctx.lineTo(r, size);
      ctx.quadraticCurveTo(0, size, 0, size - r);
      ctx.lineTo(0, r);
      ctx.quadraticCurveTo(0, 0, r, 0);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      // ── Flame mark (white) ────────────────────────────────────────────────
      // Flame native bbox: x -12..12 (24px wide), y -32..12 (44px tall)
      const scale  = (size * 0.30) / 24;   // flame ~30% of icon width
      const flameX = size * 0.50;
      const flameY = size * 0.44;           // center point of flame
      ctx.save();
      ctx.translate(flameX, flameY);
      ctx.scale(scale, scale);
      ctx.fillStyle = 'rgba(255,255,255,0.96)';
      const flame = new Path2D(
        'M0,-32 C0,-32 -12,-20 -12,-8 C-12,4 -6,12 0,12 C6,12 12,4 12,-8 ' +
        'C12,-14 8,-20 4,-24 C6,-18 6,-12 6,-8 C6,-2 4,4 0,4 ' +
        'C-4,4 -6,-2 -6,-8 C-6,-18 0,-32 0,-32 Z'
      );
      ctx.fill(flame);
      ctx.restore();

      // ── "SoulGainz" wordmark ──────────────────────────────────────────────
      const fs = Math.round(size * 0.135);
      ctx.fillStyle = '#fff';
      ctx.font = `700 ${fs}px Georgia, serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('SoulGainz', size * 0.50, size * 0.82);

      return c.toDataURL('image/png');
    }

    document.addEventListener('DOMContentLoaded', function() {
      const icon = buildIcon(180);

      // Apple touch icon
      document.getElementById('apple-touch-icon').href = icon;

      // Web App Manifest (blob URL so icons array works)
      const manifest = {
        name: "SoulGainz",
        short_name: "SoulGainz",
        start_url: ".",
        display: "standalone",
        background_color: "#f3ece0",
        theme_color: "#c4521c",
        icons: [{ src: icon, sizes: "180x180", type: "image/png" }]
      };
      const blob = new Blob([JSON.stringify(manifest)], { type: 'application/json' });
      document.getElementById('pwa-manifest').href = URL.createObjectURL(blob);

      // ── Loader control: hide for first-time users (onboarding shows first) ──
      if (!localStorage.getItem("sg_onboarded")) {
        var loader = document.getElementById("mp-loader");
        if (loader) loader.style.display = "none";
      }
    });

    // ── startLoaderSequence: called by onboarding when sign-up/skip is done ──
    window.startLoaderSequence = function() {
      var loader = document.getElementById("mp-loader");

          .then(() => console.log('✅ Offline ready'))
          .catch(e => console.log('SW:', e.message));
      });
    }

function getLastCooked(id) {
    const ts = localStorage.getItem(`mp_last_${id}`);
    if (!ts)
        return null;
    const days = Math.floor((Date.now() - new Date(ts).getTime()) / 86400000);
    if (days === 0)
        return "Today";
    if (days < 7)
        return `${days}d ago`;
    if (days < 14)
        return "1 wk ago";
    return `${Math.floor(days / 7)} wks ago`;
}
function logHistory(lunchId, dinnerId) {
    try {
        const today = new Date().toDateString();
        const hist = JSON.parse(localStorage.getItem("mp_history") || "[]");
        const idx = hist.findIndex(h => h.date === today);
        const entry = { date: today, lunch: lunchId, dinner: dinnerId };
        if (idx >= 0)
            hist[idx] = entry;
        else
            hist.unshift(entry);
        localStorage.setItem("mp_history", JSON.stringify(hist.slice(0, 56)));
    }
    catch (e) { }
}

function generateShoppingText(lr, dr, portions) {

    t += `☀️ Lunch: ${lr.name}\n🌙 Dinner: ${dr.name}\n\n`;

        items.forEach(item => {

function fmtQty(qty, unit) {

function mergeItems(lr, dr) {

            map[i.key] = Object.assign({}, i);

// ─── BOTTOM-UP MACRO COMPUTATION ─────────────────────────────────────────
// Parses portion count from recipe subtitle (e.g. "8 servings · ~10 min" → 8)
function getPortions(recipe) {
    if (!recipe) return 7;
    if (recipe.portions) return recipe.portions;
    // Match "N portions/portion/servings/serving" anywhere in the subtitle
    const m = (recipe.subtitle || "").match(/(\d+)\s+port/i);
    if (m) return parseInt(m[1]);
    const m2 = (recipe.subtitle || "").match(/(\d+)\s+serv/i);
    if (m2) return parseInt(m2[1]);
    return 7;
}

// Computes per-portion macros from batchItems × INGREDIENT_MACROS.
// scale = profileScale (1 when no custom targets set).
// Falls back to recipe.perPortion if ingredient data is insufficient.
function computePerPortion(recipe, scale) {
    const gl = scale || 1;
    if (!recipe) return { kcal: 0, protein: 0, carbs: 0, fat: 0 };
    // Pre-workout batchItems are weekly shopping units (1 pack, 3 bananas = week supply),
    // not per-portion quantities — always use hardcoded perPortion for this category.
    if (recipe.category === 'preworkout') {
        const pp = recipe.perPortion || { kcal: 0, protein: 0, carbs: 0, fat: 0 };
        return { kcal: Math.round(pp.kcal * gl), protein: Math.round(pp.protein * gl),
                 carbs: Math.round(pp.carbs * gl), fat: +((pp.fat * gl).toFixed(1)) };
    }
    const portions = getPortions(recipe);
    const items = recipe.batchItems;
    if (!items || items.length === 0) {
        const pp = recipe.perPortion || { kcal: 0, protein: 0, carbs: 0, fat: 0 };
        return { kcal: Math.round(pp.kcal * gl), protein: Math.round(pp.protein * gl),
                 carbs: Math.round(pp.carbs * gl), fat: +((pp.fat * gl).toFixed(1)) };
    }
    let totalKcal = 0, totalP = 0, totalC = 0, totalF = 0, covered = 0;
    items.forEach(item => {
        const md = INGREDIENT_MACROS[item.key];
        if (!md) return;
        let grams = 0;
        if (item.unit === 'whole') {
            const unitG = md.unitG || 0;
            grams = item.qty * unitG;
        } else if (item.unit === 'mL') {
            grams = item.qty; // treat mL as g (water-like density for broths)
        } else {
            grams = item.qty; // g
        }
        if (grams <= 0) return;
        totalKcal += (md.kcal / 100) * grams;
        totalP    += (md.p    / 100) * grams;
        totalC    += (md.c    / 100) * grams;
        totalF    += (md.f    / 100) * grams;
        covered++;
    });
    // Need at least 3 mapped ingredients to trust bottom-up; else fall back
    if (covered < 3) {
        const pp = recipe.perPortion || { kcal: 0, protein: 0, carbs: 0, fat: 0 };
        return { kcal: Math.round(pp.kcal * gl), protein: Math.round(pp.protein * gl),
                 carbs: Math.round(pp.carbs * gl), fat: +((pp.fat * gl).toFixed(1)) };
    }
    const perP = { kcal: totalKcal / portions, protein: totalP / portions,
                   carbs: totalC / portions, fat: totalF / portions };
    return {
        kcal:    Math.round(perP.kcal    * gl),
        protein: Math.round(perP.protein * gl),
        carbs:   Math.round(perP.carbs   * gl),
        fat:     +((perP.fat * gl).toFixed(1)),
    };
}
