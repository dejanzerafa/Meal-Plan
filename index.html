  <script>
    function buildIcon(size) {
      const c = document.createElement('canvas'); c.width = size; c.height = size;
      const ctx = c.getContext('2d'); const r = size * 0.18;
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(r,0);ctx.lineTo(size-r,0);ctx.quadraticCurveTo(size,0,size,r);
      ctx.lineTo(size,size-r);ctx.quadraticCurveTo(size,size,size-r,size);
      ctx.lineTo(r,size);ctx.quadraticCurveTo(0,size,0,size-r);
      ctx.lineTo(0,r);ctx.quadraticCurveTo(0,0,r,0);ctx.closePath();ctx.fill();
      const fs=Math.round(size*0.30);ctx.font=fs+'px serif';
      ctx.textAlign='center';ctx.textBaseline='middle';
      ctx.fillText('🏋🏻‍♂️',size*0.30,size*0.36);
      ctx.fillText('💪🏻',size*0.72,size*0.36);
      ctx.fillText('🥩',size*0.50,size*0.72);
      return c.toDataURL('image/png');
    }
    document.addEventListener('DOMContentLoaded',function(){
      const icon=buildIcon(180);
      document.getElementById('apple-touch-icon').href=icon;
      const manifest={name:"Meal Prep · High Protein",short_name:"Meal Prep",
        start_url:".",display:"standalone",background_color:"#08090d",theme_color:"#f97316",
        icons:[{src:icon,sizes:"180x180",type:"image/png"}]};
      const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
      document.getElementById('pwa-manifest').href=URL.createObjectURL(blob);
    });
    if('serviceWorker' in navigator){
      window.addEventListener('load',()=>navigator.serviceWorker.register('/sw.js'));
    }
