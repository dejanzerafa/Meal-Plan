  <script>
    document.addEventListener('DOMContentLoaded', function() {

      // ── Loader control: hide for first-time users (onboarding shows first) ──
      if (!localStorage.getItem("sg_onboarded")) {
        var loader = document.getElementById("mp-loader");
        if (loader) loader.style.display = "none";
      }
    });

    // ── startLoaderSequence: called by onboarding when sign-up/skip is done ──
    window.startLoaderSequence = function() {
      var loader = document.getElementById("mp-loader");
      if (loader) {
        loader.style.display = "flex";
        // Force reflow so CSS animations restart cleanly
        void loader.offsetHeight;
      }
      setTimeout(dismissLoader, 2900);
    };

    // ── Service Worker — enables full offline use ────────────────────────────
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(() => console.log('✅ Offline ready'))
          .catch(e => console.log('SW:', e.message));
      });
    }

    // ── Android install prompt (beforeinstallprompt) ─────────────────────────
    window._deferredInstallPrompt = null;
    window.addEventListener('beforeinstallprompt', function(e) {
      e.preventDefault();
      window._deferredInstallPrompt = e;
      // Dispatch a custom event so React can react
      window.dispatchEvent(new CustomEvent('installpromptready'));
    });
  </script>

    if (unit === "mL" || unit === "ml")

        ['protein','fat','carbs'].forEach(function(role) {
            const roleItems = r.batchItems.filter(function(i) { return (i.role || 'fixed') === role; });

            const anyHasShare = roleItems.some(function(i) { return i.share != null; });

function mergeItems(lr, dr) {

        return {};

        if (map[i.key])
            map[i.key] = Object.assign(Object.assign({}, map[i.key]), { qty: map[i.key].qty + i.qty });
        else
            map[i.key] = Object.assign({}, i);
    });
    if (lr.id === dr.id)
        add(lr.batchItems.map(i => (Object.assign(Object.assign({}, i), { qty: i.qty * 2 }))));
    else {
        add(lr.batchItems);
        add(dr.batchItems);
    }
    const grouped = {};
    CAT_ORDER.forEach(c => { grouped[c] = []; });
    Object.values(map).forEach(i => { (grouped[i.cat] = grouped[i.cat] || []).push(i); });
    return Object.fromEntries(Object.entries(grouped).filter(([, v]) => v.length > 0));
}

// mergeAllItems — builds the unified shopping list across all selected meal slots.
//
// Logic (per the user's spec):
//   1. For each recipe: 1 portion = base_item_qty / recipe.portions * profileScale
//   2. Shopping qty   = 1 portion * batch (p = 3 / 5 / 7)
//   3. Ingredients with the same ingId across any two slots are summed into one line.
//
// No slot-fraction splitting, no macro-driven scaling — pure proportional × batch.
function mergeAllItems(lr, dr, bfr, desr, prer, portions, bfSkipped, preSkipped, lScale, dScale, profileScale, effectiveTargets, bfScale, preScale, desScale) {
    try {
    const p  = portions || 7;
    const gl = profileScale || 1;
    const map = {};

    // addSlot: add one recipe's ingredients scaled to `p` batch days.
    // qty = base_qty * (p / recipe_portions) * profileScale
    // multiplier allows ×2 when same recipe fills both lunch + dinner slots.
    const addSlot = (recipe, multiplier) => {
        if (!recipe || !recipe.batchItems) return;
        const rPortions = recipe.flexPortions ? p : (recipe.portions || 7);
        const scale = (p / rPortions) * gl * (multiplier || 1);
        recipe.batchItems.forEach(i => {
            const rawQty = (i.qty || 0) * scale;
            // Whole-unit items (eggs, slices, wraps…): always round up so you never buy too few.
            // Gram / mL items: keep one decimal so small quantities stay accurate.
            const qty = i.unit === 'whole' ? Math.ceil(rawQty) : +rawQty.toFixed(1);
            const nk  = i.ingId ? ('ing_' + i.ingId) : normKey(i.key, i.label);
            if (map[nk]) map[nk] = Object.assign({}, map[nk], { qty: map[nk].qty + qty });
            else         map[nk] = Object.assign({}, i, { key: nk, qty });
        });
    };

    // Lunch + Dinner — same recipe both slots → multiply base by 2
    if (lr && dr && lr.id === dr.id) {
        addSlot(lr, 2);
    } else {
        addSlot(lr);
        addSlot(dr);
    }

    if (!bfSkipped && bfr) addSlot(bfr);
    if (desr)               addSlot(desr);
    if (!preSkipped && prer) addSlot(prer);

    const grouped = {};
    CAT_ORDER.forEach(c => { grouped[c] = []; });
    Object.values(map).forEach(i => { (grouped[i.cat] = grouped[i.cat] || []).push(i); });
    return Object.fromEntries(Object.entries(grouped).filter(([, v]) => v.length > 0));
    } catch(e) { console.warn('mergeAllItems error:', e); return {}; }
}

// ─── BOTTOM-UP MACRO COMPUTATION ─────────────────────────────────────────
// Parses portion count from recipe subtitle (e.g. "8 servings · ~10 min" → 8)
function getPortions(recipe, globalPortions) {
    if (!recipe) return globalPortions || 7;
    // flexPortions: recipe uses the currently-selected batch size (3/5/7)
    if (recipe.flexPortions) return globalPortions || 7;
    if (recipe.portions) return recipe.portions;
    // Match "N portions/portion/servings/serving" anywhere in the subtitle
    const m = (recipe.subtitle || "").match(/(\d+)\s+port/i);
    if (m) return parseInt(m[1]);
    const m2 = (recipe.subtitle || "").match(/(\d+)\s+serv/i);
    if (m2) return parseInt(m2[1]);
    return globalPortions || 7;
}


// ── Dynamic Ingredient Quantity Engine ──────────────────────────────────────
// Computes how many grams of each batchItem are needed to hit slotMacros.
// slotMacros = { protein, carbs, fat, kcal } — per-PORTION targets for this slot,
//   already derived from the user's daily macro targets (calcMacros result × slot fraction).
//
// ══════════════════════════════════════════════════════════════════
//  THE FOUR-STEP MACRO FRAMEWORK — the bible. Never disregarded.
// ══════════════════════════════════════════════════════════════════
//
//  01 ► CALORIE TARGET (external input — already in slotMacros)
//       Set by goal: fat loss, recomposition, or muscle gain.
//       Calibrated to bodyweight, training load, lifestyle.
//       → governs the direction of change
//
//  02 ► PROTEIN — sized first, non-negotiable
//       Anchored to bodyweight and training demand.
//       Preserves lean tissue in a deficit, builds it in a surplus.
//       → protects muscle, drives satiety
//
//  03 ► FAT — sized second, lean-food preference
//       Set high enough for hormones, low enough to leave room for carbs.
//       We ALWAYS prefer lean, fat-free sources — so fat from protein
//       ingredients (e.g. chicken, beef) is counted FIRST, and dedicated
//       fat ingredients only fill what's genuinely missing.
//       → adherence, hormones, flavour — kept on the lower end
//
//  04 ► CARBS — fill whatever kcal remains after protein + fat are locked in
//       NEVER set first. The residual lever. Scales up or down freely
//       without touching protein or hormonal health.
//       → fuel, performance, recovery
//
//  VEG — always included (baseQty × batch size)
//       Not a macro step — a nutritional constant. Every main recipe
//       includes vegetables for micronutrients and dietary balance.
//       Their macro contribution is accounted for before any macro step.
//
// Each step carries ALL of an ingredient's macros (p + c + f) forward
// into the running `used` budget so every subsequent step sees the true
// remaining room.  This prevents double-counting and keeps totals clean.
// ══════════════════════════════════════════════════════════════════
function computeIngredientQtys(recipe, slotMacros, portions) {
    if (!recipe || !Array.isArray(recipe.batchItems)) return {};
    var p  = portions || 7;
    var sm = slotMacros || {};

    function findIng(ingId) {
        return ingId ? ING_FLAT.find(function(i) { return i.id === ingId; }) : null;
    }

    // Running per-portion macro budget consumed so far
    var used = { p: 0, c: 0, f: 0 };
    var qtys = {};

    // ── VEG + FIXED: always included, batch-scaled, macros tracked ────────────
    // These are nutritional constants (vegetables, aromatics, condiments).
    // Their macro contribution is subtracted from targets before any macro step.
    // baseQty = per-portion quantity. Fallback: stored batch qty / recipe portions.
    var recipePortions = recipe.portions || 7;
    recipe.batchItems.forEach(function(item) {
        var role = item.role || 'fixed';
        if (role !== 'veg' && role !== 'fixed') return;
        var bq = (item.baseQty != null && item.baseQty > 0)
            ? item.baseQty
            : (item.qty || 0) / recipePortions;
        var qty = item.unit === 'whole' ? Math.ceil(bq * p) : Math.round(bq * p);
        qtys[item.key] = qty;
        var ing = findIng(item.ingId);
        if (ing && item.unit === 'g' && bq > 0) {
            used.p += (ing.p / 100) * bq;
            used.c += (ing.c / 100) * bq;
            used.f += (ing.f / 100) * bq;
        }
    });

    var targetP = sm.protein || 0;
    var targetF = sm.fat     || 0;
    var targetC = sm.carbs   || 0;

    // ── STEP 02 — PROTEIN: sized to hit protein target ────────────────────────
    // Share values are auto-derived from each ingredient's macro efficiency
    // (protein-per-calorie for protein role, etc.) so leaner/more-efficient
    // ingredients naturally receive a larger portion of the total batch quantity.
    // A 50/50 equal-gram split is impossible — leaner proteins always dominate.
    // ALL macros an ingredient brings (including its fat) flow into `used`.
    // Whole-unit items (eggs, cans) use unitG from ING_FLAT for macro math.
    // Fallback always uses recipePortions (NOT p) so scaling is correct.
    var totalPEff = 0; // sum of p/kcal efficiency across protein-role items
    recipe.batchItems.filter(function(i) { return (i.role || 'fixed') === 'protein'; })
    .forEach(function(item) {
        var ing = findIng(item.ingId);
        if (ing && ing.kcal > 0 && ing.p > 0) totalPEff += ing.p / ing.kcal;
    });
    var remainP = Math.max(0, targetP - used.p);
    recipe.batchItems.filter(function(i) { return (i.role || 'fixed') === 'protein'; })
    .forEach(function(item) {
        var ing   = findIng(item.ingId);
        // Auto-derive share from macro efficiency (p/kcal); leaner sources get more grams.
        // Falls back to stored share or equal split if macro data is missing.
        var share;
        if (totalPEff > 0 && ing && ing.kcal > 0 && ing.p > 0)
            share = (ing.p / ing.kcal) / totalPEff;
        else
            share = item.share != null ? item.share : 1.0;
        var perPortion;
        if (ing && item.unit === 'g' && ing.p > 0) {
            // Gram-weighted: solve directly from protein density
            perPortion = (remainP * share) / (ing.p / 100);
        } else if (ing && item.unit === 'whole' && ing.unitG && ing.p > 0) {
            // Whole-unit (eggs, cans): use per-unit protein to count units
            var pPerUnit = (ing.p / 100) * ing.unitG;
            perPortion = pPerUnit > 0 ? (remainP * share) / pPerUnit : (item.qty || 0) / recipePortions;

// Dietary suitability tags — computed from what the recipe does NOT contain
function getDietaryTags(recipe) {
    if (!recipe || !recipe.batchItems) return [];
    const all = recipe.batchItems.map(i => (i.name || i.label || "").toLowerCase()).join(" ");
    const tags = [];
    const hasGluten = ["flour","bread","pasta","tortilla","bagel","soy sauce","wheat","oat","wrap","noodle","pita","couscous","bulgur","seitan","panko","rice cake"].some(t => all.includes(t));
    const hasDairy  = ["cheese","milk","butter","cream","yogurt","yoghurt","whey","cheddar","parmesan","mozzarella","ricotta","feta","ghee","lactose","sour cream"].some(t => all.includes(t));
    const hasEgg    = ["egg"].some(t => all.includes(t));
    const hasNut    = ["peanut","almond","cashew","walnut","pecan","pistachio","hazelnut","macadamia","pine nut","nut butter"].some(t => all.includes(t));
    const hasSoy    = ["soy","tofu","edamame","miso","tempeh","tamari"].some(t => all.includes(t));
    if (!hasGluten) tags.push({ label: "Gluten-Free", color: "#b45309", bg: "rgba(180,83,9,0.10)", border: "rgba(180,83,9,0.25)" });
    if (!hasDairy)  tags.push({ label: "Dairy-Free",  color: "#0891b2", bg: "rgba(8,145,178,0.10)", border: "rgba(8,145,178,0.25)" });
    if (!hasEgg)    tags.push({ label: "Egg-Free",    color: "#d97706", bg: "rgba(217,119,6,0.10)", border: "rgba(217,119,6,0.25)" });
    if (!hasNut)    tags.push({ label: "Nut-Free",    color: "#65a30d", bg: "rgba(101,163,13,0.10)", border: "rgba(101,163,13,0.25)" });
    if (!hasSoy)    tags.push({ label: "Soy-Free",    color: "#7c3aed", bg: "rgba(124,58,237,0.10)", border: "rgba(124,58,237,0.25)" });
    return tags;

function detectAllergens(recipe) {
    if (!recipe || !recipe.batchItems) return [];
    const allLabels = recipe.batchItems.map(i => (i.name || i.label || "").toLowerCase()).join(" ");
    const found = [];
    ALLERGEN_MAP.forEach(a => {

    return found;
}

// ── Four-step macro framework ────────────────────────────────────────────────
// Order is non-negotiable:
//   01 kcal   → set by goal (deficit / maintenance / surplus)
//   02 protein → anchored to bodyweight — preserves muscle, drives satiety
//   03 fat     → anchored to bodyweight — supports hormones and food enjoyment
//   04 carbs   → whatever kcal remain — fuel for training and recovery
//
// Carbs are NEVER set first. They fill the room after the load-bearing walls.
function calcMacros(tdee, weight, goal, bmr, gender, loseRate) {
    if (!tdee || !weight)
        return { kcal: 0, protein: 0, carbs: 0, fat: 0, deficit: 0, deficitNote: "", proteinPerKg: 0, fatPerKg: 0 };

    // ── STEP 01: Set calorie target ──────────────────────────────────────────
    const clinicalMin = gender === "female" ? 1200 : 1500;
    const deficitMap  = { light: 300, sustainable: 500, aggressive: 700 };
    const deficitAmt  = deficitMap[loseRate] || 500;
    let kcal, deficitNote = "";
    if (goal === "lose") {
        const ideal = tdee - deficitAmt;
        if (ideal >= clinicalMin) {
            kcal = Math.round(ideal);
        } else {
            kcal = clinicalMin;
            deficitNote = `Deficit reduced to ${tdee - clinicalMin} kcal to stay above the safe minimum of ${clinicalMin} kcal. Adding light activity would allow a larger deficit.`;
        }
    } else if (goal === "gain") {
        kcal = Math.round(tdee + 300);
    } else {
        kcal = Math.round(tdee);
    }
    const deficit = goal === "lose" ? tdee - kcal : goal === "gain" ? -(kcal - tdee) : 0;

    // ── STEP 02: Set protein — anchored to bodyweight ────────────────────────
    // Lose / recomp: 2.0 g/kg  — preserves lean tissue in a deficit
    // Gain:          2.4 g/kg  — maximises muscle protein synthesis in a surplus
    const proteinPerKg = goal === "gain" ? 2.4 : 2.0;
    const proteinG = Math.round(weight * proteinPerKg);

    // ── STEP 03: Set fat — anchored to bodyweight ────────────────────────────
    // Lose:   0.8 g/kg — above hormone minimum, leaves maximum room for carbs
    // Recomp: 1.0 g/kg — balanced support for hormones and food enjoyment
    // Gain:   1.2 g/kg — more flexibility in a calorie surplus
    const fatPerKg = goal === "lose" ? 0.8 : goal === "gain" ? 1.2 : 1.0;
    const fatG = Math.round(weight * fatPerKg);

    // ── STEP 04: Carbs fill the remaining calories ───────────────────────────
    // This is the lever for training, recovery, and energy.
    // It automatically adjusts as protein and fat are dialled in.
    const carbG = Math.max(0, Math.round((kcal - proteinG * 4 - fatG * 9) / 4));

    return { kcal, protein: proteinG, carbs: carbG, fat: fatG, deficit, deficitNote, proteinPerKg, fatPerKg };
}

  <!-- Safety net: force-remove loader after 7s max, no matter what -->
  <script>
