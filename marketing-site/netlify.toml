[build]
  publish = "."

# ── Pretty URLs ──────────────────────────────────────────────────────────────
[[redirects]]
  from = "/pricing"
  to   = "/pricing.html"
  status = 200

[[redirects]]
  from = "/about"
  to   = "/about.html"
  status = 200

[[redirects]]
  from = "/sign-up"
  to   = "/sign-up.html"
  status = 200

# Stripe's success_url (set in create-checkout.js). Verifies the payment and
# hands the session across to soulgainz.app.
[[redirects]]
  from = "/success"
  to   = "/success.html"
  status = 200

[[redirects]]
  from = "/contact"
  to   = "/contact.html"
  status = 200

# Terms & Privacy are GENERATED from the canonical copies at the repo root by
# scripts/build-legal-pages.mjs — never hand-edit marketing-site/terms.html or
# privacy.html. check-legal-consistency.mjs fails the build if they drift.
[[redirects]]
  from = "/terms"
  to   = "/terms.html"
  status = 200

[[redirects]]
  from = "/privacy"
  to   = "/privacy.html"
  status = 200

# ── 404 fallback ─────────────────────────────────────────────────────────────
[[redirects]]
  from   = "/*"
  to     = "/404.html"
  status = 404

# ── Security headers ─────────────────────────────────────────────────────────
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options            = "DENY"   # matches CSP frame-ancestors 'none'
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy    = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self' https://rjreunvnsfjclpighogp.supabase.co https://*.supabase.co https://soulgainz.app/.netlify/functions/ https://checkout.stripe.com https://fonts.googleapis.com; frame-ancestors 'none'; base-uri 'none'; form-action 'none'; object-src 'none';"

# ── CORS for assets ───────────────────────────────────────────────────────────
# ⚠️ Cache-Control must match the REQUEST path, not the file on disk.
# Pretty URLs are rewrites (/pricing -> /pricing.html), so a rule scoped to
# "/*.html" never fires for "/pricing" and the page gets Netlify's default
# caching — which is why deploys kept appearing "broken" (users were served a
# stale copy). Default everything to revalidate, then re-cache real assets below.
[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# Static assets. ORDER MATTERS: later rules override earlier ones, so the
# broad extension rules come FIRST and the fingerprinted /assets/* rule LAST —
# previously /assets/* was declared first and every /assets/app.abc123.css was
# silently downgraded from 1 year to 7 days by the /*.css rule below it.
[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/*.svg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The self-hosted Supabase bundle is 211 KB and render-blocking in <head>.
# With no .js rule it fell through to the catch-all "max-age=0,
# must-revalidate", costing a blocking round-trip on every single navigation —
# partly undoing the reliability win of self-hosting it in the first place.
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
