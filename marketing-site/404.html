<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — SoulGainz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..900;1,9..144,300..900&family=Instrument+Sans:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0C0B0A; color: #F2EDE6;
      font-family: "Instrument Sans", -apple-system, sans-serif;
      min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center; padding: 24px;
    }
    .code { font-size: 96px; font-weight: 900; color: #E07B2A; line-height: 1; margin-bottom: 12px; font-family: "Fraunces", Georgia, serif; }
    h1 { font-size: 28px; font-weight: 800; margin-bottom: 12px; letter-spacing: -0.02em; font-family: "Fraunces", Georgia, serif; }
    p { color: #8A8580; font-size: 16px; margin-bottom: 32px; }
    .btn {
      display: inline-block; background: #E07B2A; color: #0C0B0A;
      padding: 13px 28px; border-radius: 10px; font-weight: 700; font-size: 14px;
      text-decoration: none; transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.88; }
    .logo { position: absolute; top: 24px; left: 24px; font-family: "Fraunces", Georgia, serif; font-size: 18px; font-weight: 800; color: #F2EDE6; text-decoration: none; }
    .logo span { color: #E07B2A; }
  </style>
</head>
<body>
  <a href="/" class="logo">Soul<span>Gainz</span></a>
  <div class="code">404</div>
  <h1>Page not found</h1>
  <p>This page doesn't exist or has been moved.</p>
  <a href="/" class="btn">Go home →</a>
</body>
</html>
